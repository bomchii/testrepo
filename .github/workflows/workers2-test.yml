name: Workers2 test (Actions runner)

# Verifica en el runner (16 GB RAM) la prueba C14-workers2, que NO cabe en
# la VM (6 GB): el servidor con --workers 2 carga los dos modelos (3.5 GB)
# dos veces (~7 GB + overhead) y el OOM-killer lo mata al arrancar
# (rc=-9). No es un bug de codigo: con --workers 1 el servidor funciona
# bien en la VM. Aqui se verifica que con 16 GB el servidor arranca con
# dos workers y atiende dos peticiones en paralelo, igual que la definicion
# de C14 en run_http.py (POST /v1/tts, format wav, max_tokens 128, dos
# peticiones concurrentes, ambas HTTP 200 con audio valido).
#
# Solo manual (workflow_dispatch). NUNCA en push/PR.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers2-test-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  workers2-test:
    name: C14-workers2 on ubuntu-24.04 runner
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Reclaim runner disk space
        shell: bash
        run: bash tools/ci/reclaim-linux-runner-space.sh

      - name: Prepare Crow/Asio/tokenizer
        shell: bash
        run: bash tools/ci/prepare-linux-deps.sh common

      # Mismos pasos de build que linux-cpu.yml.
      - name: Build portable CPU in manylinux2014
        shell: bash
        run: |
          set -euo pipefail
          image=quay.io/pypa/manylinux2014_x86_64
          docker pull "$image"
          python3 tools/ci/run-with-diagnostics.py --label "Linux CPU portable build" --log ci-logs/linux-cpu-build.log -- \
            docker run --rm --platform linux/amd64 \
              -e S2_BUILD_JOBS=3 \
              -v "$PWD:/src" -w /src \
              "$image" \
              /bin/bash -lc 'cat /etc/os-release; ldd --version | sed -n '1p'; gcc --version | sed -n '1p'; tar --version | sed -n '1p'; bash tools/ci/build-linux-portable.sh cpu'
          test -x s2-linux-cpu-x86-64
          ./s2-linux-cpu-x86-64 --runtime-info

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -version | head -1

      - name: Download stock models (mach9243, HuggingFace)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models workers2-test
          cd models
          curl -sSL -o s2-pro-q4_k_m-transformer-only.gguf \
            "https://huggingface.co/mach9243/s2-pro-gguf/resolve/main/s2-pro-q4_k_m-transformer-only.gguf"
          curl -sSL -o s2-pro-q4_k_m-codec-only.gguf \
            "https://huggingface.co/mach9243/s2-pro-gguf/resolve/main/s2-pro-q4_k_m-codec-only.gguf"
          test "$(stat -c%s s2-pro-q4_k_m-transformer-only.gguf)" -gt 1000000000
          test "$(stat -c%s s2-pro-q4_k_m-codec-only.gguf)" -gt 100000000

      # C14-equivalent: servidor con --workers 2 + dos peticiones en
      # paralelo, igual que run_http.py. --threads 4: el runner tiene
      # 4 vCPU (la bateria de la VM usa 2).
      - name: C14-equivalent (server --workers 2, two parallel requests)
        shell: bash
        run: |
          set -euo pipefail
          cd workers2-test
          mkdir -p voices
          ../s2-linux-cpu-x86-64 \
            --model ../models/s2-pro-q4_k_m-transformer-only.gguf \
            --model-codec ../models/s2-pro-q4_k_m-codec-only.gguf \
            -v -1 --threads 4 --ffmpeg /usr/bin/ffmpeg \
            --port 8081 --voice-dir voices --workers 2 > server.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          start=$(date +%s)
          for i in $(seq 1 120); do
            if curl -sS -o /dev/null "http://127.0.0.1:8081/health" 2>/dev/null; then break; fi
            sleep 5
          done
          curl -sS "http://127.0.0.1:8081/health"; echo
          echo "server up after $(( $(date +%s) - start )) s" | tee server-up.log
          # Two parallel requests, exactly like the battery's C14.
          for i in 0 1; do
            printf '{"text": "Parallel request number %s.", "format": "wav", "max_tokens": 128}' "$i" > "c14-$i.json"
          done
          start=$(date +%s)
          ( timeout 3600 curl -sS -X POST "http://127.0.0.1:8081/v1/tts" \
              -H "Content-Type: application/json" -d @c14-0.json \
              -o c14-0.wav -w "%{http_code}" > c14-0.code ) &
          P0=$!
          ( timeout 3600 curl -sS -X POST "http://127.0.0.1:8081/v1/tts" \
              -H "Content-Type: application/json" -d @c14-1.json \
              -o c14-1.wav -w "%{http_code}" > c14-1.code ) &
          P1=$!
          wait $P0; rc0=$?
          wait $P1; rc1=$?
          echo "C14 parallel requests rc=$rc0/$rc1 elapsed_s=$(( $(date +%s) - start ))" | tee c14.log
          echo "c14-0 http_code=$(cat c14-0.code) curl_rc=$rc0" | tee -a c14.log
          echo "c14-1 http_code=$(cat c14-1.code) curl_rc=$rc1" | tee -a c14.log
          test "$rc0" = "0" -a "$rc1" = "0"
          test "$(cat c14-0.code)" = "200"
          test "$(cat c14-1.code)" = "200"
          test -s c14-0.wav
          test -s c14-1.wav
          kill $SRV 2>/dev/null || true
          trap - EXIT

      - name: Verify outputs (WAV non-silent)
        shell: bash
        run: |
          set -euo pipefail
          cd workers2-test
          python3 - <<'PYEOF'
          import math, struct, wave
          def check_wav(path):
              with wave.open(path, "rb") as w:
                  n = w.getnframes(); rate = w.getframerate()
                  frames = w.readframes(n)
              vals = struct.unpack(f"<{len(frames)//2}h", frames)
              rms = math.sqrt(sum(v*v for v in vals) / len(vals)) if vals else 0.0
              peak = max(abs(v) for v in vals) if vals else 0
              print(f"{path}: {n} frames, {n/rate:.3f} s, RMS {rms:.1f}, peak {peak}")
              assert n > 0 and rms > 0, f"{path}: empty or silent"
          check_wav("c14-0.wav")
          check_wav("c14-1.wav")
          with open("workers2-test-results.txt", "w") as f:
              f.write("Workers2 test (Actions runner, 16 GB) — C14-workers2\n")
              f.write("Server --workers 2 started, two parallel /v1/tts requests\n")
              f.write("both HTTP 200, both WAVs valid and non-silent\n")
              f.write("C14-workers2 PASS (environmental on the 6 GB VM)\n")
          PYEOF
          cat workers2-test-results.txt

      - name: Upload workers2-test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workers2-test-results
          path: |
            workers2-test/*.wav
            workers2-test/*.log
            workers2-test/*.json
            workers2-test/*.code
            workers2-test/workers2-test-results.txt
            ci-logs/
          if-no-files-found: warn
          retention-days: 30
