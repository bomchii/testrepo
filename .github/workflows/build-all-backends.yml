name: Build s2.cpp - Windows/Linux CPU + Vulkan + CUDA + ROCm + macOS CPU/Metal

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Force JavaScript actions to Node 24, including nested/composite actions that still declare Node 20.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  VULKAN_VERSION: '1.4.357.0'
  VULKAN_SHA256: '81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d'

jobs:
  preflight:
    name: Workflow preflight - actionlint + shell parsers + repository guards
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate workflow with pinned actionlint 1.7.12
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 -o "$RUNNER_TEMP/$archive" "$url"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes= .github/workflows/build-all-backends.yml

      - name: Extract every workflow run command
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-run-blocks
          python3 tools/ci/extract-workflow-run-blocks.py .github/workflows/build-all-backends.yml .ci-run-blocks
          find .ci-run-blocks -maxdepth 1 -type f -print | LC_ALL=C sort

      - name: Parse PowerShell scripts and every pwsh run block
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $targets = @('patch-cmake.ps1', 'patch-cmake-cuda.ps1')
          $targets += @(Get-ChildItem .ci-run-blocks -Filter 'pwsh-run-*.ps1' -File | Sort-Object Name | ForEach-Object FullName)
          foreach ($file in $targets) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
              if ($parseErrors.Count -ne 0) {
                  $parseErrors | ForEach-Object { Write-Error "${file}: $($_.Message) at $($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber)" }
                  throw "PowerShell parser rejected ${file}"
              }
          }
          Write-Host "POWERSHELL_PARSE_PASS files=$($targets.Count)"

      - name: Parse Bash scripts and every bash run block
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find tools/ci -type f -name '*.sh' -print0)
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find .ci-run-blocks -maxdepth 1 -type f -name 'bash-run-*.sh' -print0)
          echo BASH_PARSE_PASS

      - name: Run workflow/repository consistency guards
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_cli_parser_sync.py
          python3 tools/check_docs_api_sync.py
          python3 tools/check_ci_invariants.py

  build:
    name: Windows Server 2025 - VS 2026 - Vulkan
    # Pin the current Windows image explicitly instead of relying on a moving
    # windows-latest alias. The image provides Windows Server 2025 + VS 2026/v145.
    runs-on: windows-2025-vs2026
    needs: preflight
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verificar toolchain VS 2026
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw "cmake --version failed with exit $LASTEXITCODE" }
          $cmakeHelp = cmake --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $cmakeHelp -notmatch [regex]::Escape("Visual Studio 18 2026")) {
              throw 'Installed CMake does not expose generator "Visual Studio 18 2026" (requires CMake >= 4.2).'
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-Not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vsRoot = & $vswhere -latest -products * -version '[18.0,19.0)' -property installationPath
          if ($LASTEXITCODE -ne 0 -or -Not $vsRoot) { throw "Visual Studio 2026 not found" }
          $cl = Get-ChildItem "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" -ErrorAction Stop |
                Sort-Object FullName -Descending | Select-Object -First 1
          if (-Not $cl) { throw "VS 2026 x64 cl.exe not found" }
          Write-Host "VS2026=$vsRoot"
          Write-Host "cl.exe=$($cl.FullName)"
          Write-Host "cl version=$($cl.VersionInfo.FileVersion)"

      - name: Install pinned Vulkan SDK from LunarG
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "vulkansdk-$env:VULKAN_VERSION.exe"
          $sdk = Join-Path $env:RUNNER_TEMP "VulkanSDK\$env:VULKAN_VERSION"
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"

          Write-Host "Downloading LunarG Vulkan SDK $env:VULKAN_VERSION"
          curl.exe -fL --retry 3 --retry-delay 2 -o $installer $url
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK download failed with exit $LASTEXITCODE" }

          $actualHash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:VULKAN_SHA256.ToLowerInvariant()) {
              throw "Vulkan SDK SHA-256 mismatch: expected $env:VULKAN_SHA256, got $actualHash"
          }
          Write-Host "Vulkan SDK SHA-256 verified: $actualHash"

          # copy_only avoids mutating the runner's machine-wide Vulkan runtime.
          & $installer --root $sdk --accept-licenses --default-answer --confirm-command install copy_only=1
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK installer failed with exit $LASTEXITCODE" }

          $inc = Join-Path $sdk "Include"
          $lib = Join-Path $sdk "Lib\vulkan-1.lib"
          $glslc = Join-Path $sdk "Bin\glslc.exe"
          foreach ($required in @($inc, $lib, $glslc)) {
              if (-Not (Test-Path $required)) { throw "Vulkan SDK component missing: $required" }
          }

          "VULKAN_SDK=$sdk"         >> $env:GITHUB_ENV
          "Vulkan_INCLUDE_DIR=$inc" >> $env:GITHUB_ENV
          "Vulkan_LIBRARY=$lib"     >> $env:GITHUB_ENV
          (Join-Path $sdk "Bin")    >> $env:GITHUB_PATH

          Write-Host "VULKAN_SDK = $sdk"
          Write-Host "Include    = $inc"
          Write-Host "Library    = $lib"
          & $glslc --version
          if ($LASTEXITCODE -ne 0) { throw "glslc --version failed" }

      # Los shaders se generan desde cero durante el build.
      # No usamos los precompilados del ZIP porque fueron generados sin
      # soporte coopmat, y el Vulkan SDK actual los detecta como disponibles,
      # causando una discrepancia entre el .hpp y el .cpp.

      - name: Cache Crow/Asio headers
        uses: actions/cache@v6
        with:
          path: |
            build/_deps/crow-include
            build/_deps/asio-include
          key: crow-asio-${{ runner.os }}-crow1.3.4-ae0fef0-asio1.30.2

      - name: Parchear CMakeLists.txt para Windows
        shell: pwsh
        run: pwsh -File patch-cmake.ps1

      - name: Generate byte-exact embedded tokenizer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          if ($LASTEXITCODE -ne 0) { throw "Python not available" }
          python tools/embed_tokenizer.py tokenizer.json src/tokenizer_data.cpp src/tokenizer_data.h
          if ($LASTEXITCODE -ne 0) { throw "tokenizer embedding failed" }
          Write-Host "Embedded tokenizer source size: $([math]::Round((Get-Item src/tokenizer_data.cpp).Length/1MB,2)) MB"
      - name: CMake Configure
        shell: pwsh
        run: |
          $crow = (Resolve-Path 'build\_deps\crow-include').Path
          $asio = (Resolve-Path 'build\_deps\asio-include').Path
          python tools/ci/run-with-diagnostics.py --label "Windows Vulkan configure" --log ci-logs/windows-vulkan-configure.log -- cmake -G "Visual Studio 18 2026" -A x64 -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DS2_CROW_INCLUDE_DIR="$crow" `
            -DS2_ASIO_INCLUDE_DIR="$asio" `
            -DS2_VULKAN=ON `
            -DGGML_VULKAN=ON `
            -DS2_CUDA=OFF `
            -DS2_METAL=OFF `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_VULKAN_FLASH_ATTENTION=ON `
            -DVulkan_INCLUDE_DIR="$env:Vulkan_INCLUDE_DIR" `
            -DVulkan_LIBRARY="$env:Vulkan_LIBRARY" `
            -DGGML_VULKAN_COOPMAT_GLSLC_SUPPORT=OFF `
            -DGGML_VULKAN_COOPMAT2_GLSLC_SUPPORT=OFF `
            -DGGML_VULKAN_INTEGER_DOT_GLSLC_SUPPORT=OFF `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX512=OFF

      - name: CMake Build
        shell: pwsh
        run: python tools/ci/run-with-diagnostics.py --label "Windows Vulkan build" --log ci-logs/windows-vulkan-build.log -- cmake --build build --config Release --parallel 4

      - name: Verificar ejecutable
        shell: pwsh
        run: |
          $exe = "build\Release\s2-vulkan.exe"
          if (-Not (Test-Path $exe)) {
            Write-Error "s2-vulkan.exe no fue generado."
            exit 1
          }
          $sizeMB = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "OK: s2-vulkan.exe generado ($sizeMB MB)"

          # ---- Structural check (always runs; needs no GPU and no loader) --------
          # s2-vulkan.exe links ggml statically, so its only non-system imports should be
          # vulkan-1.dll (the Vulkan loader) plus the VC runtime and a few Win32
          # libs. Enumerate the import table with dumpbin and fail on anything
          # unexpected -- this catches packaging/link regressions regardless of
          # whether the exe can actually be launched on this headless runner.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-Not (Test-Path $vswhere)) { Write-Error "vswhere no encontrado"; exit 1 }
          $vsRoot  = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue |
                     Select-Object -First 1
          if (-Not $dumpbin) { Write-Error "dumpbin no encontrado -- no se pueden verificar dependencias"; exit 1 }

          $deps = & $dumpbin.FullName /dependents $exe |
                  Select-String -Pattern '^\s+\S+\.dll\s*$' |
                  ForEach-Object { $_.ToString().Trim() }
          Write-Host "`n--- s2-vulkan.exe dependents ---"
          $deps | ForEach-Object { Write-Host "    $_" }
          Write-Host "-------------------------`n"

          # /MT makes the normal MSVC CRT static, but MSVC OpenMP is special:
          # VCOMP.LIB is an import library for VCOMP140.DLL. Keep OpenMP enabled
          # for performance and allow only that VC runtime dependency. The one-file
          # artifact therefore requires the Microsoft VC++ v14 Redistributable
          # for OpenMP, plus vulkan-1.dll from the GPU driver. CUDA imports are
          # explicitly forbidden even if a CUDA driver DLL happens to be in System32.
          $sys32 = Join-Path $env:WINDIR "System32"
          $hasVulkan  = $false
          $unexpected = @()
          foreach ($d in $deps) {
              $name = $d.ToLower()
              if ($name -eq 'vulkan-1.dll') { $hasVulkan = $true; continue }
              if ($name -eq 'nvcuda.dll' -or $name -like 'cublas*.dll' -or $name -like 'cudart*.dll' -or $name -like 'nvrtc*.dll') {
                  $unexpected += $d; continue
              }
              if ($name -match '^(msvcp|vcruntime|concrt)') { $unexpected += $d; continue }
              if ($name -like 'vcomp*.dll') { continue } # MSVC OpenMP runtime; external VC++ v14 redist
              if ($name -like 'api-ms-win-*' -or $name -like 'ext-ms-win-*') { continue }
              if (Test-Path (Join-Path $sys32 $name)) { continue }   # OS-provided
              $unexpected += $d
          }
          if (-Not $hasVulkan) {
              Write-Error "vulkan-1.dll no figura como dependencia -- el artefacto no es un build Vulkan valido."
              exit 1
          }
          if ($unexpected.Count -gt 0) {
              Write-Error ("Dependencias no resolubles en una maquina Windows estandar (revisar link/empaquetado): " + ($unexpected -join ', '))
              exit 1
          }
          Write-Host "OK: s2-vulkan.exe importa Vulkan + DLLs del sistema; solo VCOMP puede quedar dinamico por OpenMP."

          # ---- Opportunistic execution (only if the loader is available) ---------
          # s2-vulkan.exe imports the Vulkan loader (vulkan-1.dll). On a headless runner
          # there is no GPU driver. The pinned LunarG SDK is installed copy-only,
          # so a runnable loader DLL may still be absent. If we can find a loader
          # we copy it next to the exe and
          # run `--help` (which returns in the arg parser BEFORE any Vulkan init, so
          # it only needs the import table to resolve) -- this additionally proves
          # the binary loads and is not an AVX/illegal-instruction crash. If no
          # loader is available, we SKIP execution (the structural check above
          # already gates the build) rather than fail. End-user machines always
          # have vulkan-1.dll via their GPU drivers; this is a CI-only concern.
          $vkDll = $null
          $cands = @(
              (Join-Path $env:VULKAN_SDK "Bin\vulkan-1.dll"),
              (Join-Path $env:VULKAN_SDK "bin\vulkan-1.dll"),
              (Join-Path $env:VULKAN_SDK "runtime\x64\vulkan-1.dll"),
              "C:\Windows\System32\vulkan-1.dll")
          foreach ($c in $cands) { if ($c -and (Test-Path $c)) { $vkDll = $c; break } }
          if (-Not $vkDll -and $env:VULKAN_SDK -and (Test-Path $env:VULKAN_SDK)) {
              $vkDll = Get-ChildItem -Path $env:VULKAN_SDK -Recurse -Filter vulkan-1.dll -ErrorAction SilentlyContinue |
                       Select-Object -First 1 -ExpandProperty FullName
          }

          if (-Not $vkDll) {
              Write-Host "NOTA: vulkan-1.dll no disponible en el runner; se omite la ejecucion de --help."
              Write-Host "      (La verificacion estructural ya valido las dependencias. La ejecucion real"
              Write-Host "       requiere vulkan-1.dll, presente en cualquier maquina con drivers de GPU.)"
              Write-Host "OK: s2-vulkan.exe verificado (sin ejecucion)."
          } else {
              Copy-Item $vkDll "build\Release\" -Force
              Write-Host "OK: vulkan-1.dll encontrada y copiada junto al exe ($vkDll)"
              & $exe --help 2>&1 | Out-Null
              $ec = $LASTEXITCODE
              if ($ec -eq -1073741515) {
                Write-Error "s2-vulkan.exe failed with STATUS_DLL_NOT_FOUND (0xC0000135) -- a required DLL is still missing next to the exe"
                exit 1
              }
              if ($ec -eq -1073741795) {
                Write-Error "s2-vulkan.exe failed with STATUS_ILLEGAL_INSTRUCTION (0xC000001D) -- CPU executed an unsupported instruction (check AVX level / GGML_AVX512)"
                exit 1
              }
              if ($ec -ne 0 -and $ec -ne 1) {
                Write-Error "s2-vulkan.exe terminated abnormally (exit code: $ec)"
                exit 1
              }
              $global:LASTEXITCODE = 0
              Write-Host "OK: s2-vulkan.exe ejecuta correctamente (--help)"
          }

      - name: Empaquetar release
        shell: pwsh
        run: |
          # GGML/Crow/tokenizer y el CRT normal van dentro del exe (/MT). MSVC OpenMP
          # usa VCOMP140.DLL dinamico, por lo que el artefacto sigue siendo un solo
          # s2-vulkan.exe pero requiere el Microsoft VC++ v14 x64 Redistributable.
          # vulkan-1.dll lo proporciona el driver Vulkan (NVIDIA/AMD/Intel).

          New-Item -ItemType Directory -Force -Path release | Out-Null

          Copy-Item build\Release\s2-vulkan.exe release\s2-windows-vulkan-x86-64.exe

          # tokenizer.json ya esta embebido en s2-vulkan.exe — no se distribuye por separado.
          # Solo se incluye si el build fallo en embeber (fallback de seguridad).
          $hasFallback = $false
          if (Test-Path tokenizer.json) {
              # Comprobar si el exe tiene el simbolo embebido
              # (si tokenizer_data.h se genero correctamente, no hace falta el .json)
              Write-Host "INFO: tokenizer.json presente en repo pero NO incluido en release (embebido en exe)"
          }

          $files = @(Get-ChildItem release -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 's2-windows-vulkan-x86-64.exe') {
              throw "Vulkan artifact must contain exactly one s2-windows-vulkan-x86-64.exe"
          }
          $sizeMB = [math]::Round((Get-Item release\s2-windows-vulkan-x86-64.exe).Length / 1MB, 1)
          Write-Host "`nContenido del release:"
          Get-ChildItem release\ | Format-Table Name, Length -AutoSize
          Write-Host "Tamanio de s2-vulkan.exe: $sizeMB MB (incluye tokenizer embebido)"

      - name: Verify non-empty direct artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $f = Get-Item 'release/s2-windows-vulkan-x86-64.exe'
          if ($f.Length -le 0) { throw "Direct artifact is empty: $($f.FullName)" }

      - name: Subir artifact
        uses: actions/upload-artifact@v7
        with:
          name: s2-windows-vulkan-x86-64.exe
          path: release/s2-windows-vulkan-x86-64.exe
          if-no-files-found: error
          archive: false


      - name: Collect robust crash report
        if: failure()
        shell: pwsh
        run: python tools/ci/collect-crash-report.py --label "Windows Vulkan" --logs ci-logs --output ci-logs/job-crash-report.txt

      - name: Upload concise failure diagnostics
        if: ${{ failure() && hashFiles('ci-logs/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-vulkan-diagnostics
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  build-cuda:
    name: Windows Server 2025 - VS 2026 - CUDA 13.2 - Ninja
    runs-on: windows-2025-vs2026
    needs: preflight
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Assemble pinned CUDA 13.2 toolkit from NVIDIA redistributable archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $redistBase = 'https://developer.download.nvidia.com/compute/cuda/redist'
          $manifestPath = Join-Path $env:RUNNER_TEMP 'redistrib_13.2.0.json'
          curl.exe -fL --retry 3 --retry-delay 2 -o $manifestPath "$redistBase/redistrib_13.2.0.json"
          if ($LASTEXITCODE -ne 0) { throw "CUDA redistrib manifest download failed" }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json

          $components = @(
            @{ Key='cuda_cccl';        Version='13.2.27'; Sha='fb61bbca384ea9e5722f3b77cfdd635c916f33593d187562510ce14831aa629a' },
            @{ Key='cuda_crt';         Version='13.2.51'; Sha='02892bd6bc7ec832c5fc6fc794491803166ee8455bd87d52976c4b195b76c8e7' },
            @{ Key='cuda_cudart';      Version='13.2.51'; Sha='906b430b53e6396f7cbaa6874fbe7f9307a184e830b119a4ad3f58dc6e0165c6' },
            @{ Key='cuda_nvcc';        Version='13.2.51'; Sha='a6bacac79adb923e310eb39f2b86d4d9e756c896d035dfead50c69403eca4661' },
            @{ Key='libnvvm';          Version='13.2.51'; Sha='ef2a24cf40f9394e2f13df5a8a7315c65325103006a53692cd12b8c48431e372' },
            @{ Key='libnvptxcompiler'; Version='13.2.51'; Sha='19c12ad13d8d0a7ee2ad9f9896f18be3052684aa0b3e199ba57f344482dce45b' },
            @{ Key='libcublas';        Version='13.3.0.5'; Sha='438a88f07af3721eda15ed1f4d2b957ea810e29061b2a6292837f35520dbd212' },
            @{ Key='libnvjitlink';     Version='13.2.51'; Sha='b192c79a449efc6a6593be46bc56928281789a4bb0b8714321c8a1b1684ff74f' }
          )

          $cudaRoot = Join-Path $env:RUNNER_TEMP 'cuda-13.2-redist'
          $downloadDir = Join-Path $env:RUNNER_TEMP 'cuda-13.2-downloads'
          Remove-Item $cudaRoot, $downloadDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $cudaRoot, $downloadDir | Out-Null

          foreach ($component in $components) {
              $property = $manifest.PSObject.Properties[$component.Key]
              if ($null -eq $property) { throw "CUDA manifest missing component $($component.Key)" }
              $entry = $property.Value
              if ([string]$entry.version -ne $component.Version) {
                  throw "CUDA manifest version mismatch for $($component.Key): expected $($component.Version), got $($entry.version)"
              }
              $platformProperty = $entry.PSObject.Properties['windows-x86_64']
              if ($null -eq $platformProperty) { throw "CUDA manifest missing windows-x86_64 for $($component.Key)" }
              $platform = $platformProperty.Value
              $manifestSha = ([string]$platform.sha256).ToLowerInvariant()
              if ($manifestSha -ne $component.Sha) {
                  throw "CUDA manifest SHA mismatch for $($component.Key): expected $($component.Sha), got $manifestSha"
              }
              $relative = [string]$platform.relative_path
              if ($relative -notlike "$($component.Key)/windows-x86_64/*.zip") {
                  throw "Unexpected CUDA archive path for $($component.Key): $relative"
              }
              $archive = Join-Path $downloadDir ([IO.Path]::GetFileName($relative))
              curl.exe -fL --retry 3 --retry-delay 2 -o $archive "$redistBase/$relative"
              if ($LASTEXITCODE -ne 0) { throw "CUDA component download failed: $($component.Key)" }
              $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
              if ($actual -ne $component.Sha) {
                  throw "CUDA archive SHA mismatch for $($component.Key): expected $($component.Sha), got $actual"
              }

              $extract = Join-Path $downloadDir ("extract-" + $component.Key)
              New-Item -ItemType Directory -Force $extract | Out-Null
              Expand-Archive -Path $archive -DestinationPath $extract -Force
              $children = @(Get-ChildItem $extract -Force)
              $source = $extract
              if ($children.Count -eq 1 -and $children[0].PSIsContainer) { $source = $children[0].FullName }
              Get-ChildItem $source -Recurse -File -Force | ForEach-Object {
                  $relativeFile = [IO.Path]::GetRelativePath($source, $_.FullName)
                  $destination = Join-Path $cudaRoot $relativeFile
                  New-Item -ItemType Directory -Force (Split-Path -Parent $destination) | Out-Null
                  Copy-Item $_.FullName $destination -Force
              }
              Write-Host "CUDA_COMPONENT_PASS key=$($component.Key) version=$($component.Version)"
          }

          $required = @(
            'bin\nvcc.exe', 'include\cuda_runtime.h', 'include\cccl\cub', 'include\cccl\thrust', 'include\cccl\cuda',
            'include\cublas_v2.h', 'lib\x64\cudart_static.lib', 'lib\x64\cudadevrt.lib',
            'lib\x64\cuda.lib', 'lib\x64\cublas.lib', 'lib\x64\cublasLt.lib',
            'nvvm\libdevice\libdevice.10.bc', 'bin\cicc.exe', 'bin\ptxas.exe',
            'bin\nvlink.exe', 'bin\fatbinary.exe'
          )
          foreach ($relative in $required) {
              if (-Not (Test-Path (Join-Path $cudaRoot $relative))) { throw "Assembled CUDA toolkit missing $relative" }
          }
          foreach ($pattern in @('cublas64_*.dll', 'cublasLt64_*.dll', 'nvJitLink*.dll')) {
              if (-Not (Get-ChildItem (Join-Path $cudaRoot 'bin') -Filter $pattern -File -ErrorAction SilentlyContinue)) {
                  throw "Assembled CUDA toolkit missing runtime DLL pattern $pattern"
              }
          }
          if (Get-ChildItem $cudaRoot -Recurse -Filter 'nvcuda.dll' -File -ErrorAction SilentlyContinue) {
              throw 'nvcuda.dll is driver-owned and must not be present in the assembled toolkit'
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-Not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vsRoot = & $vswhere -latest -products * -version '[18.0,19.0)' -property installationPath
          if ($LASTEXITCODE -ne 0 -or -Not $vsRoot) { throw "Visual Studio 2026 not found" }
          $devShell = Join-Path $vsRoot 'Common7\Tools\Launch-VsDevShell.ps1'
          if (-Not (Test-Path $devShell)) { throw "Launch-VsDevShell.ps1 not found: $devShell" }
          if (-Not (Get-Command ninja.exe -ErrorAction SilentlyContinue)) { throw "ninja.exe not found on runner" }

          "CUDA_PATH=$cudaRoot" >> $env:GITHUB_ENV
          "CUDAToolkit_ROOT=$cudaRoot" >> $env:GITHUB_ENV
          "VS2026_PATH=$vsRoot" >> $env:GITHUB_ENV
          (Join-Path $cudaRoot 'bin') >> $env:GITHUB_PATH
          Write-Host "CUDA_PATH=$cudaRoot"
          Write-Host "VS2026_PATH=$vsRoot"

      - name: Probe CUDA compiler with Ninja + VS 2026 host compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:VS2026_PATH\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if ($LASTEXITCODE -ne 0) { throw "Launch-VsDevShell failed" }
          $cl = (Get-Command cl.exe -ErrorAction Stop).Source
          $nvcc = Join-Path $env:CUDA_PATH 'bin\nvcc.exe'
          ninja --version
          cl.exe 2>&1 | Select-Object -First 8 | ForEach-Object { Write-Host $_ }
          & $nvcc --version
          if ($LASTEXITCODE -ne 0) { throw "nvcc --version failed" }

          $probe = Join-Path $env:RUNNER_TEMP 's2-cuda-cmake-probe'
          Remove-Item $probe -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $probe | Out-Null
          @'
          cmake_minimum_required(VERSION 3.18)
          project(cuda_probe LANGUAGES CXX CUDA)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CUDA_STANDARD 17)
          add_executable(cuda_probe main.cu)
          '@ | Set-Content -Encoding UTF8 (Join-Path $probe 'CMakeLists.txt')
          @'
          #include <cuda_runtime.h>
          __global__ void probe_kernel() {}
          int main() { probe_kernel<<<1,1>>>(); return 0; }
          '@ | Set-Content -Encoding UTF8 (Join-Path $probe 'main.cu')
          $build = Join-Path $probe 'build'
          python tools/ci/run-with-diagnostics.py --label "Windows CUDA compiler probe configure" --log ci-logs/windows-cuda-probe-configure.log -- cmake -G Ninja -S $probe -B $build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl.exe `
            -DCMAKE_CXX_COMPILER=cl.exe `
            -DCMAKE_CUDA_COMPILER="$nvcc" `
            -DCMAKE_CUDA_HOST_COMPILER="$cl" `
            -DCUDAToolkit_ROOT="$env:CUDA_PATH" `
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci/run-with-diagnostics.py --label "Windows CUDA compiler probe build" --log ci-logs/windows-cuda-probe-build.log -- cmake --build $build --parallel 2 --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-Not (Test-Path (Join-Path $build 'cuda_probe.exe'))) { throw "CUDA probe did not produce cuda_probe.exe" }
          Write-Host "CUDA_NINJA_PROBE_PASS host=$cl nvcc=$nvcc"

      - name: Cache Crow/Asio headers
        uses: actions/cache@v6
        with:
          path: |
            build/_deps/crow-include
            build/_deps/asio-include
          key: crow-asio-${{ runner.os }}-crow1.3.4-ae0fef0-asio1.30.2

      - name: Prepare Crow/Asio for CUDA
        shell: pwsh
        run: pwsh -File patch-cmake-cuda.ps1

      - name: Generate byte-exact embedded tokenizer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/embed_tokenizer.py tokenizer.json src/tokenizer_data.cpp src/tokenizer_data.h
          if ($LASTEXITCODE -ne 0) { throw "tokenizer embedding failed" }

      - name: CMake Configure (CUDA, Ninja)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:VS2026_PATH\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if ($LASTEXITCODE -ne 0) { throw "Launch-VsDevShell failed" }
          $cl = (Get-Command cl.exe -ErrorAction Stop).Source
          $nvcc = Join-Path $env:CUDA_PATH 'bin\nvcc.exe'
          $crow = (Resolve-Path 'build\_deps\crow-include').Path
          $asio = (Resolve-Path 'build\_deps\asio-include').Path
          python tools/ci/run-with-diagnostics.py --label "Windows CUDA configure" --log ci-logs/windows-cuda-configure.log -- cmake -G Ninja -B build-cuda -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl.exe `
            -DCMAKE_CXX_COMPILER=cl.exe `
            -DCMAKE_CUDA_COMPILER="$nvcc" `
            -DCMAKE_CUDA_HOST_COMPILER="$cl" `
            -DCUDAToolkit_ROOT="$env:CUDA_PATH" `
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static `
            -DS2_CROW_INCLUDE_DIR="$crow" `
            -DS2_ASIO_INCLUDE_DIR="$asio" `
            -DS2_CUDA=ON `
            -DGGML_CUDA=ON `
            -DS2_VULKAN=OFF `
            -DS2_METAL=OFF `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_AVX2=ON `
            -DGGML_STATIC=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX512=OFF `
            -DGGML_VULKAN_FLASH_ATTENTION=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: CMake Build (CUDA, Ninja)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:VS2026_PATH\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if ($LASTEXITCODE -ne 0) { throw "Launch-VsDevShell failed" }
          python tools/ci/run-with-diagnostics.py --label "Windows CUDA build" --log ci-logs/windows-cuda-build.log -- cmake --build build-cuda --parallel 2 --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify CUDA core and native launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $core = "build-cuda\s2-cuda-core.exe"
          $launcher = "build-cuda\s2-cuda-launcher.exe"
          if (-Not (Test-Path $core)) { throw "s2-cuda-core.exe was not generated" }
          if (-Not (Test-Path $launcher)) { throw "s2-cuda-launcher.exe was not generated" }
          $dumpbin = Get-ChildItem "$env:VS2026_PATH\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction Stop |
                     Sort-Object FullName -Descending | Select-Object -First 1
          function Get-Deps([string]$file) {
            @(& $dumpbin.FullName /dependents $file | Select-String -Pattern '^\s+\S+\.dll\s*$' | ForEach-Object { $_.ToString().Trim().ToLowerInvariant() })
          }
          $coreDeps = Get-Deps $core
          $launcherDeps = Get-Deps $launcher
          Write-Host "--- CUDA core imports ---"; $coreDeps | ForEach-Object { Write-Host "  $_" }
          Write-Host "--- launcher imports ---"; $launcherDeps | ForEach-Object { Write-Host "  $_" }
          if ($coreDeps -contains 'vulkan-1.dll') { throw "CUDA core unexpectedly imports vulkan-1.dll" }
          if ($coreDeps | Where-Object { $_ -match '^(vcruntime|msvcp|concrt)' }) { throw "CUDA core unexpectedly depends on dynamic MSVC CRT: $($coreDeps -join ', ')" }
          if (-Not ($coreDeps | Where-Object { $_ -eq 'nvcuda.dll' -or $_ -like 'cublas*.dll' -or $_ -like 'cudart*.dll' })) { throw "CUDA core has no CUDA import evidence" }
          if ($launcherDeps | Where-Object { $_ -eq 'nvcuda.dll' -or $_ -like 'cublas*.dll' -or $_ -like 'cudart*.dll' -or $_ -like 'nvrtc*.dll' }) { throw "Outer launcher must not import CUDA libraries: $($launcherDeps -join ', ')" }
          if ($launcherDeps | Where-Object { $_ -match '^(vcruntime|msvcp|vcomp)' }) { throw "Outer launcher is not CRT-single-file: $($launcherDeps -join ', ')" }

      - name: Build single-file CUDA container
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $core = (Resolve-Path "build-cuda\s2-cuda-core.exe").Path
          $launcher = (Resolve-Path "build-cuda\s2-cuda-launcher.exe").Path
          $cudaBin = Join-Path $env:CUDA_PATH 'bin'
          if (-Not (Test-Path $cudaBin)) { throw "CUDA bin does not exist: $cudaBin" }
          $dumpbin = Get-ChildItem "$env:VS2026_PATH\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction Stop |
                     Sort-Object FullName -Descending | Select-Object -First 1
          function Get-PeDependencies([string]$file) {
            @(& $dumpbin.FullName /dependents $file | Select-String -Pattern '^\s+\S+\.dll\s*$' | ForEach-Object { $_.ToString().Trim() })
          }

          Remove-Item cuda-payload, release-cuda -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force cuda-payload, release-cuda | Out-Null
          Copy-Item $core cuda-payload\s2-cuda-core.exe
          $sys32 = Join-Path $env:WINDIR 'System32'
          $queue = [System.Collections.Generic.Queue[string]]::new(); $queue.Enqueue($core)
          $seen = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $copied = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $missing = [System.Collections.Generic.List[string]]::new()

          # cuBLAS may load cuBLASLt dynamically, so seed it explicitly and then
          # walk imports recursively. Toolkit DLLs win over polluted System32.
          Get-ChildItem $cudaBin -Filter 'cublasLt64_*.dll' -ErrorAction SilentlyContinue | ForEach-Object {
            if ($copied.Add($_.Name)) { Copy-Item $_.FullName (Join-Path cuda-payload $_.Name); $queue.Enqueue($_.FullName) }
          }
          while ($queue.Count -gt 0) {
            $current = $queue.Dequeue(); if (-Not $seen.Add($current)) { continue }
            foreach ($dep in (Get-PeDependencies $current)) {
              $low = $dep.ToLowerInvariant()
              if ($low -eq 'nvcuda.dll') { continue }
              if ($low -like 'api-ms-win-*' -or $low -like 'ext-ms-win-*') { continue }
              if ($low -like 'vcomp*.dll') {
                $vcDll = Get-ChildItem (Join-Path $env:VS2026_PATH 'VC\Redist\MSVC') -Recurse -File -Filter $dep -ErrorAction SilentlyContinue |
                         Where-Object { $_.FullName -match '\\x64\\' -and $_.FullName -notmatch 'debug_nonredist|onecore' } |
                         Sort-Object FullName -Descending | Select-Object -First 1
                if ($vcDll) {
                  if ($copied.Add($dep)) { Copy-Item $vcDll.FullName (Join-Path cuda-payload $dep); $queue.Enqueue($vcDll.FullName) }
                  continue
                }
                $missing.Add("$dep (MSVC OpenMP runtime required by $([IO.Path]::GetFileName($current)))")
                continue
              }
              $cudaDll = Join-Path $cudaBin $dep
              if (Test-Path $cudaDll) {
                if ($copied.Add($dep)) { Copy-Item $cudaDll (Join-Path cuda-payload $dep); $queue.Enqueue($cudaDll) }
                continue
              }
              if (Test-Path (Join-Path $sys32 $dep)) { continue }
              $missing.Add("$dep (required by $([IO.Path]::GetFileName($current)))")
            }
          }
          if ($missing.Count) { throw "Unresolved non-system dependencies: $((($missing | Sort-Object -Unique) -join ', '))" }
          if (Test-Path cuda-payload\nvcuda.dll) { throw "nvcuda.dll must never be bundled" }

          python tools/cuda_bundle.py --launcher $launcher --payload-dir cuda-payload --output release-cuda\s2-windows-cuda-x86-64.exe
          if ($LASTEXITCODE -ne 0) { throw "CUDA bundler failed" }
          $outer = (Resolve-Path release-cuda\s2-windows-cuda-x86-64.exe).Path
          $outerDeps = Get-PeDependencies $outer | ForEach-Object { $_.ToLowerInvariant() }
          if ($outerDeps | Where-Object { $_ -eq 'nvcuda.dll' -or $_ -like 'cublas*.dll' -or $_ -like 'cudart*.dll' -or $_ -like 'nvrtc*.dll' }) { throw "Final outer s2-windows-cuda-x86-64.exe imports CUDA: $($outerDeps -join ', ')" }

          # Exercise the final container parser before upload. This path does not
          # require a GPU: it validates the appended manifest/payload and reports it.
          $runtimeInfo = @(& $outer --runtime-info 2>&1 | ForEach-Object { $_.ToString() })
          if ($LASTEXITCODE -ne 0) { throw "Final s2-windows-cuda-x86-64.exe --runtime-info validation failed" }
          $runtimeText = $runtimeInfo -join "`n"
          Write-Host $runtimeText
          if ($runtimeText -notmatch '(?m)^payload_files:\s+[1-9][0-9]*\s*$') { throw "CUDA runtime-info did not report a non-empty payload" }
          if ($runtimeText -notmatch '(?m)^\s+s2-cuda-core\.exe\s+') { throw "CUDA runtime-info is missing s2-cuda-core.exe" }
          if ($runtimeText -match '(?im)^\s+nvcuda\.dll\s+') { throw "CUDA runtime-info reports forbidden nvcuda.dll payload" }

          $files = @(Get-ChildItem release-cuda -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 's2-windows-cuda-x86-64.exe') { throw "CUDA artifact must contain exactly one s2-windows-cuda-x86-64.exe" }
          Write-Host "OK: single-file CUDA artifact built and self-validated; nvcuda.dll is supplied by the NVIDIA driver."

      - name: Verify non-empty direct artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $f = Get-Item 'release-cuda/s2-windows-cuda-x86-64.exe'
          if ($f.Length -le 0) { throw "Direct artifact is empty: $($f.FullName)" }

      - name: Upload CUDA artifact
        uses: actions/upload-artifact@v7
        with:
          name: s2-windows-cuda-x86-64.exe
          path: release-cuda/s2-windows-cuda-x86-64.exe
          if-no-files-found: error
          archive: false


      - name: Collect robust crash report
        if: failure()
        shell: pwsh
        run: python tools/ci/collect-crash-report.py --label "Windows CUDA" --logs ci-logs --output ci-logs/job-crash-report.txt

      - name: Upload concise failure diagnostics
        if: ${{ failure() && hashFiles('ci-logs/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-cuda-diagnostics
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  build-cpu:
    name: Windows Server 2025 - VS 2026 - CPU only
    runs-on: windows-2025-vs2026
    needs: preflight
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verificar toolchain VS 2026
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw "cmake --version failed with exit $LASTEXITCODE" }
          $cmakeHelp = cmake --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $cmakeHelp -notmatch [regex]::Escape("Visual Studio 18 2026")) {
              throw 'Installed CMake does not expose generator "Visual Studio 18 2026" (requires CMake >= 4.2).'
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-Not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vsRoot = & $vswhere -latest -products * -version '[18.0,19.0)' -property installationPath
          if ($LASTEXITCODE -ne 0 -or -Not $vsRoot) { throw "Visual Studio 2026 not found" }
          $cl = Get-ChildItem "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" -ErrorAction Stop |
                Sort-Object FullName -Descending | Select-Object -First 1
          if (-Not $cl) { throw "VS 2026 x64 cl.exe not found" }
          Write-Host "VS2026=$vsRoot"
          Write-Host "cl.exe=$($cl.FullName)"
          Write-Host "cl version=$($cl.VersionInfo.FileVersion)"

      - name: Cache Crow/Asio headers
        uses: actions/cache@v6
        with:
          path: |
            build/_deps/crow-include
            build/_deps/asio-include
          key: crow-asio-${{ runner.os }}-crow1.3.4-ae0fef0-asio1.30.2

      - name: Prepare portable CMake/Crow
        shell: pwsh
        run: pwsh -File patch-cmake.ps1 -SkipVulkanPortabilityPatch

      - name: Generate byte-exact embedded tokenizer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          if ($LASTEXITCODE -ne 0) { throw "Python not available" }
          python tools/embed_tokenizer.py tokenizer.json src/tokenizer_data.cpp src/tokenizer_data.h
          if ($LASTEXITCODE -ne 0) { throw "tokenizer embedding failed" }
          Write-Host "Embedded tokenizer source size: $([math]::Round((Get-Item src/tokenizer_data.cpp).Length/1MB,2)) MB"

      - name: CMake Configure (CPU only)
        shell: pwsh
        run: |
          $crow = (Resolve-Path 'build\_deps\crow-include').Path
          $asio = (Resolve-Path 'build\_deps\asio-include').Path
          python tools/ci/run-with-diagnostics.py --label "Windows CPU configure" --log ci-logs/windows-cpu-configure.log -- cmake -G "Visual Studio 18 2026" -A x64 -B build-cpu -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DS2_CROW_INCLUDE_DIR="$crow" `
            -DS2_ASIO_INCLUDE_DIR="$asio" `
            -DS2_VULKAN=OFF `
            -DS2_CUDA=OFF `
            -DS2_METAL=OFF `
            -DGGML_VULKAN=OFF `
            -DGGML_CUDA=OFF `
            -DGGML_METAL=OFF `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX512=OFF

      - name: CMake Build (CPU only)
        shell: pwsh
        run: python tools/ci/run-with-diagnostics.py --label "Windows CPU build" --log ci-logs/windows-cpu-build.log -- cmake --build build-cpu --config Release --parallel 4

      - name: Verify CPU-only executable
        shell: pwsh
        run: |
          $exe = "build-cpu\Release\s2-cpu.exe"
          if (-Not (Test-Path $exe)) { Write-Error "CPU s2-cpu.exe was not generated"; exit 1 }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot  = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
                     Select-Object -First 1
          if (-Not $dumpbin) { Write-Error "dumpbin not found"; exit 1 }
          $deps = & $dumpbin.FullName /dependents $exe |
                  Select-String -Pattern '^\s+\S+\.dll\s*$' |
                  ForEach-Object { $_.ToString().Trim().ToLower() }
          if ($deps -contains 'vulkan-1.dll' -or $deps -contains 'nvcuda.dll' -or
              ($deps | Where-Object { $_ -like 'cublas*.dll' -or $_ -like 'cudart*.dll' -or $_ -like 'nvrtc*.dll' })) {
              Write-Error "CPU artifact unexpectedly links a GPU runtime: $($deps -join ', ')"
              exit 1
          }
          if ($deps | Where-Object { $_ -match '^(vcruntime|msvcp|concrt)' }) {
              Write-Error "CPU artifact unexpectedly uses the dynamic MSVC CRT despite /MT: $($deps -join ', ')"
              exit 1
          }
          if ($deps | Where-Object { $_ -like 'vcomp*.dll' }) {
              Write-Host "INFO: CPU artifact keeps OpenMP performance and therefore requires the VC++ v14 x64 Redistributable (VCOMP)."
          }

          & $exe --help 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "CPU executable failed --help"; exit 1 }
          Write-Host "OK: CPU-only executable has no GPU imports, no dynamic normal CRT, and starts successfully."

      - name: Package CPU release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-cpu | Out-Null
          Copy-Item build-cpu\Release\s2-cpu.exe release-cpu\s2-windows-cpu-x86-64.exe
          if (Test-Path release-cpu\tokenizer.json) { Remove-Item release-cpu\tokenizer.json -Force }
          $files = @(Get-ChildItem release-cpu -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 's2-windows-cpu-x86-64.exe') {
              throw "CPU artifact must contain exactly one s2-windows-cpu-x86-64.exe"
          }
          Write-Host "OK: tokenizer is embedded; CPU artifact contains only s2-cpu.exe"

      - name: Verify non-empty direct artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $f = Get-Item 'release-cpu/s2-windows-cpu-x86-64.exe'
          if ($f.Length -le 0) { throw "Direct artifact is empty: $($f.FullName)" }

      - name: Upload CPU artifact
        uses: actions/upload-artifact@v7
        with:
          name: s2-windows-cpu-x86-64.exe
          path: release-cpu/s2-windows-cpu-x86-64.exe
          if-no-files-found: error
          archive: false


