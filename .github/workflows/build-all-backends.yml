name: Build s2.cpp - CPU + Vulkan + CUDA + Metal

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows Server 2025 - VS 2026 - Vulkan
    # Pin the current Windows image explicitly instead of relying on a moving
    # windows-latest alias. The image provides Windows Server 2025 + VS 2026/v145.
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verificar toolchain VS 2026
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw "cmake --version failed with exit $LASTEXITCODE" }
          $cmakeHelp = cmake --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $cmakeHelp -notmatch [regex]::Escape("Visual Studio 18 2026")) {
              throw 'Installed CMake does not expose generator "Visual Studio 18 2026" (requires CMake >= 4.2).'
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-Not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vsRoot = & $vswhere -latest -products * -version '[18.0,19.0)' -property installationPath
          if ($LASTEXITCODE -ne 0 -or -Not $vsRoot) { throw "Visual Studio 2026 not found" }
          $cl = Get-ChildItem "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" -ErrorAction Stop |
                Sort-Object FullName -Descending | Select-Object -First 1
          if (-Not $cl) { throw "VS 2026 x64 cl.exe not found" }
          Write-Host "VS2026=$vsRoot"
          Write-Host "cl.exe=$($cl.FullName)"
          Write-Host "cl version=$($cl.VersionInfo.FileVersion)"

      - name: Instalar Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Verificar y exportar rutas del Vulkan SDK
        shell: pwsh
        run: |
          # El action escribe VULKAN_SDK al entorno, pero CMake a veces
          # no lo recoge. Lo exportamos explicitamente con las rutas exactas.
          $sdk = $env:VULKAN_SDK
          if (-Not $sdk) {
            # Fallback: buscar en la ruta tipica de instalacion de LunarG
            $sdk = Get-ChildItem "C:\VulkanSDK" -Directory |
                   Sort-Object Name -Descending |
                   Select-Object -First 1 -ExpandProperty FullName
          }
          if (-Not $sdk) { Write-Error "VULKAN_SDK no encontrado"; exit 1 }

          Write-Host "VULKAN_SDK = $sdk"

          $inc  = "$sdk\Include"
          $lib  = "$sdk\Lib\vulkan-1.lib"

          if (-Not (Test-Path $inc))  { Write-Error "Include dir no existe: $inc";  exit 1 }
          if (-Not (Test-Path $lib))  { Write-Error "vulkan-1.lib no existe: $lib"; exit 1 }

          # Persistir para los steps siguientes
          "VULKAN_SDK=$sdk"             >> $env:GITHUB_ENV
          "Vulkan_INCLUDE_DIR=$inc"     >> $env:GITHUB_ENV
          "Vulkan_LIBRARY=$lib"         >> $env:GITHUB_ENV
          "$sdk\Bin"                    >> $env:GITHUB_PATH

          Write-Host "Include : $inc"
          Write-Host "Library : $lib"

      # Los shaders se generan desde cero durante el build.
      # No usamos los precompilados del ZIP porque fueron generados sin
      # soporte coopmat, y el Vulkan SDK actual los detecta como disponibles,
      # causando una discrepancia entre el .hpp y el .cpp.

      - name: Cache Crow/Asio headers
        uses: actions/cache@v6
        with:
          path: |
            build/_deps/crow-include
            build/_deps/asio-include
          key: crow-asio-${{ runner.os }}-crow1.3.3-asio1.30.2

      - name: Parchear CMakeLists.txt para Windows
        shell: pwsh
        run: pwsh -File patch-cmake.ps1

      - name: Generate byte-exact embedded tokenizer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          if ($LASTEXITCODE -ne 0) { throw "Python not available" }
          python tools/embed_tokenizer.py tokenizer.json src/tokenizer_data.cpp src/tokenizer_data.h
          if ($LASTEXITCODE -ne 0) { throw "tokenizer embedding failed" }
          Write-Host "Embedded tokenizer source size: $([math]::Round((Get-Item src/tokenizer_data.cpp).Length/1MB,2)) MB"
      - name: CMake Configure
        shell: pwsh
        run: |
          cmake -G "Visual Studio 18 2026" -A x64 -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DS2_VULKAN=ON `
            -DGGML_VULKAN=ON `
            -DS2_CUDA=OFF `
            -DS2_METAL=OFF `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_VULKAN_FLASH_ATTENTION=ON `
            -DVulkan_INCLUDE_DIR="$env:Vulkan_INCLUDE_DIR" `
            -DVulkan_LIBRARY="$env:Vulkan_LIBRARY" `
            -DGGML_VULKAN_COOPMAT_GLSLC_SUPPORT=OFF `
            -DGGML_VULKAN_COOPMAT2_GLSLC_SUPPORT=OFF `
            -DGGML_VULKAN_INTEGER_DOT_GLSLC_SUPPORT=OFF `
            -DGGML_AVX512=OFF

      - name: CMake Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Verificar ejecutable
        shell: pwsh
        run: |
          $exe = "build\Release\s2.exe"
          if (-Not (Test-Path $exe)) {
            Write-Error "s2.exe no fue generado."
            exit 1
          }
          $sizeMB = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "OK: s2.exe generado ($sizeMB MB)"

          # ---- Structural check (always runs; needs no GPU and no loader) --------
          # s2.exe links ggml statically, so its only non-system imports should be
          # vulkan-1.dll (the Vulkan loader) plus the VC runtime and a few Win32
          # libs. Enumerate the import table with dumpbin and fail on anything
          # unexpected -- this catches packaging/link regressions regardless of
          # whether the exe can actually be launched on this headless runner.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-Not (Test-Path $vswhere)) { Write-Error "vswhere no encontrado"; exit 1 }
          $vsRoot  = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue |
                     Select-Object -First 1
          if (-Not $dumpbin) { Write-Error "dumpbin no encontrado -- no se pueden verificar dependencias"; exit 1 }

          $deps = & $dumpbin.FullName /dependents $exe |
                  Select-String -Pattern '^\s+\S+\.dll\s*$' |
                  ForEach-Object { $_.ToString().Trim() }
          Write-Host "`n--- s2.exe dependents ---"
          $deps | ForEach-Object { Write-Host "    $_" }
          Write-Host "-------------------------`n"

          # /MT makes the normal MSVC CRT static, but MSVC OpenMP is special:
          # VCOMP.LIB is an import library for VCOMP140.DLL. Keep OpenMP enabled
          # for performance and allow only that VC runtime dependency. The one-file
          # artifact therefore requires the Microsoft VC++ v14 Redistributable
          # for OpenMP, plus vulkan-1.dll from the GPU driver. CUDA imports are
          # explicitly forbidden even if a CUDA driver DLL happens to be in System32.
          $sys32 = Join-Path $env:WINDIR "System32"
          $hasVulkan  = $false
          $unexpected = @()
          foreach ($d in $deps) {
              $name = $d.ToLower()
              if ($name -eq 'vulkan-1.dll') { $hasVulkan = $true; continue }
              if ($name -eq 'nvcuda.dll' -or $name -like 'cublas*.dll' -or $name -like 'cudart*.dll' -or $name -like 'nvrtc*.dll') {
                  $unexpected += $d; continue
              }
              if ($name -match '^(msvcp|vcruntime|concrt)') { $unexpected += $d; continue }
              if ($name -like 'vcomp*.dll') { continue } # MSVC OpenMP runtime; external VC++ v14 redist
              if ($name -like 'api-ms-win-*' -or $name -like 'ext-ms-win-*') { continue }
              if (Test-Path (Join-Path $sys32 $name)) { continue }   # OS-provided
              $unexpected += $d
          }
          if (-Not $hasVulkan) {
              Write-Error "vulkan-1.dll no figura como dependencia -- el artefacto no es un build Vulkan valido."
              exit 1
          }
          if ($unexpected.Count -gt 0) {
              Write-Error ("Dependencias no resolubles en una maquina Windows estandar (revisar link/empaquetado): " + ($unexpected -join ', '))
              exit 1
          }
          Write-Host "OK: s2.exe importa Vulkan + DLLs del sistema; solo VCOMP puede quedar dinamico por OpenMP."

          # ---- Opportunistic execution (only if the loader is available) ---------
          # s2.exe imports the Vulkan loader (vulkan-1.dll). On a headless runner
          # there is no GPU driver, and humbletim/install-vulkan-sdk lays down a
          # minimal SDK that does NOT reliably ship the prebuilt loader DLL, so it
          # may be absent. If we can find a loader we copy it next to the exe and
          # run `--help` (which returns in the arg parser BEFORE any Vulkan init, so
          # it only needs the import table to resolve) -- this additionally proves
          # the binary loads and is not an AVX/illegal-instruction crash. If no
          # loader is available, we SKIP execution (the structural check above
          # already gates the build) rather than fail. End-user machines always
          # have vulkan-1.dll via their GPU drivers; this is a CI-only concern.
          $vkDll = $null
          $cands = @(
              (Join-Path $env:VULKAN_SDK "Bin\vulkan-1.dll"),
              (Join-Path $env:VULKAN_SDK "bin\vulkan-1.dll"),
              (Join-Path $env:VULKAN_SDK "runtime\x64\vulkan-1.dll"),
              "C:\Windows\System32\vulkan-1.dll")
          foreach ($c in $cands) { if ($c -and (Test-Path $c)) { $vkDll = $c; break } }
          if (-Not $vkDll -and $env:VULKAN_SDK -and (Test-Path $env:VULKAN_SDK)) {
              $vkDll = Get-ChildItem -Path $env:VULKAN_SDK -Recurse -Filter vulkan-1.dll -ErrorAction SilentlyContinue |
                       Select-Object -First 1 -ExpandProperty FullName
          }

          if (-Not $vkDll) {
              Write-Host "NOTA: vulkan-1.dll no disponible en el runner; se omite la ejecucion de --help."
              Write-Host "      (La verificacion estructural ya valido las dependencias. La ejecucion real"
              Write-Host "       requiere vulkan-1.dll, presente en cualquier maquina con drivers de GPU.)"
              Write-Host "OK: s2.exe verificado (sin ejecucion)."
          } else {
              Copy-Item $vkDll "build\Release\" -Force
              Write-Host "OK: vulkan-1.dll encontrada y copiada junto al exe ($vkDll)"
              & $exe --help 2>&1 | Out-Null
              $ec = $LASTEXITCODE
              if ($ec -eq -1073741515) {
                Write-Error "s2.exe failed with STATUS_DLL_NOT_FOUND (0xC0000135) -- a required DLL is still missing next to the exe"
                exit 1
              }
              if ($ec -eq -1073741795) {
                Write-Error "s2.exe failed with STATUS_ILLEGAL_INSTRUCTION (0xC000001D) -- CPU executed an unsupported instruction (check AVX level / GGML_AVX512)"
                exit 1
              }
              if ($ec -ne 0 -and $ec -ne 1) {
                Write-Error "s2.exe terminated abnormally (exit code: $ec)"
                exit 1
              }
              $global:LASTEXITCODE = 0
              Write-Host "OK: s2.exe ejecuta correctamente (--help)"
          }

      - name: Empaquetar release
        shell: pwsh
        run: |
          # GGML/Crow/tokenizer y el CRT normal van dentro del exe (/MT). MSVC OpenMP
          # usa VCOMP140.DLL dinamico, por lo que el artefacto sigue siendo un solo
          # s2.exe pero requiere el Microsoft VC++ v14 x64 Redistributable.
          # vulkan-1.dll lo proporciona el driver Vulkan (NVIDIA/AMD/Intel).

          New-Item -ItemType Directory -Force -Path release | Out-Null

          Copy-Item build\Release\s2.exe release\

          # tokenizer.json ya esta embebido en s2.exe — no se distribuye por separado.
          # Solo se incluye si el build fallo en embeber (fallback de seguridad).
          $hasFallback = $false
          if (Test-Path tokenizer.json) {
              # Comprobar si el exe tiene el simbolo embebido
              # (si tokenizer_data.h se genero correctamente, no hace falta el .json)
              Write-Host "INFO: tokenizer.json presente en repo pero NO incluido en release (embebido en exe)"
          }

          $sizeMB = [math]::Round((Get-Item release\s2.exe).Length / 1MB, 1)
          Write-Host "`nContenido del release:"
          Get-ChildItem release\ | Format-Table Name, Length -AutoSize
          Write-Host "Tamanio de s2.exe: $sizeMB MB (incluye tokenizer embebido)"

      - name: Subir artifact
        uses: actions/upload-artifact@v7
        with:
          name: s2-windows-vulkan
          path: release/
          retention-days: 30

  build-cuda:
    name: Windows Server 2025 - VS 2026 - CUDA 13.2
    # CUDA 13.2 officially supports MSVC 195x / Visual Studio 2026 and
    # Windows Server 2025, so use the current v145 toolchain directly.
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Instalar CUDA Toolkit 13.2
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.0'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      - name: Verificar CUDA y toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw "cmake --version failed with exit $LASTEXITCODE" }
          $cmakeHelp = cmake --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $cmakeHelp -notmatch [regex]::Escape("Visual Studio 18 2026")) {
              throw 'Installed CMake does not expose generator "Visual Studio 18 2026" (requires CMake >= 4.2).'
          }
          nvcc --version
          if ($LASTEXITCODE -ne 0) { throw "nvcc --version failed with exit $LASTEXITCODE" }

          $cudaPath = $env:CUDA_PATH
          if (-Not $cudaPath) { Write-Error "CUDA_PATH no encontrado"; exit 1 }
          Write-Host "CUDA_PATH = $cudaPath"
          "CUDA_PATH=$cudaPath" >> $env:GITHUB_ENV

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-Not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vsRoot = & $vswhere -latest -products * -version '[18.0,19.0)' -property installationPath
          if (-Not $vsRoot) { Write-Error "Visual Studio 2026 no encontrado"; exit 1 }
          $cl = Get-ChildItem "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending | Select-Object -First 1
          if (-Not $cl) { Write-Error "cl.exe v145 no encontrado"; exit 1 }
          Write-Host "VS2026 = $vsRoot"
          Write-Host "cl.exe  = $($cl.FullName)"
          Write-Host "cl file version = $($cl.VersionInfo.FileVersion)"

      - name: Cache Crow/Asio headers
        uses: actions/cache@v6
        with:
          path: |
            build/_deps/crow-include
            build/_deps/asio-include
          key: crow-asio-${{ runner.os }}-crow1.3.3-asio1.30.2

      - name: Parchear CMakeLists.txt para CUDA
        shell: pwsh
        run: pwsh -File patch-cmake-cuda.ps1

      - name: Generate byte-exact embedded tokenizer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          if ($LASTEXITCODE -ne 0) { throw "Python not available" }
          python tools/embed_tokenizer.py tokenizer.json src/tokenizer_data.cpp src/tokenizer_data.h
          if ($LASTEXITCODE -ne 0) { throw "tokenizer embedding failed" }
          Write-Host "Embedded tokenizer source size: $([math]::Round((Get-Item src/tokenizer_data.cpp).Length/1MB,2)) MB"
      - name: CMake Configure (CUDA)
        shell: pwsh
        run: |
          cmake -G "Visual Studio 18 2026" -A x64 -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DS2_CUDA=ON `
            -DGGML_CUDA=ON `
            -DS2_VULKAN=OFF `
            -DS2_METAL=OFF `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_AVX2=ON `
            -DGGML_STATIC=ON `
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static `
            -DGGML_AVX512=OFF `
            -DGGML_VULKAN_FLASH_ATTENTION=OFF

      - name: CMake Build (CUDA)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Verify CUDA core and native launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $core = "build\Release\s2-cuda-core.exe"
          $launcher = "build\Release\s2-cuda-launcher.exe"
          if (-Not (Test-Path $core)) { throw "s2-cuda-core.exe was not generated" }
          if (-Not (Test-Path $launcher)) { throw "s2-cuda-launcher.exe was not generated" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -version '[18.0,19.0)' -property installationPath
          $dumpbin = Get-ChildItem "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction Stop |
                     Sort-Object FullName -Descending | Select-Object -First 1
          function Get-Deps([string]$file) {
            @(& $dumpbin.FullName /dependents $file | Select-String -Pattern '^\s+\S+\.dll\s*$' | ForEach-Object { $_.ToString().Trim().ToLowerInvariant() })
          }
          $coreDeps = Get-Deps $core
          $launcherDeps = Get-Deps $launcher
          Write-Host "--- CUDA core imports ---"; $coreDeps | ForEach-Object { Write-Host "  $_" }
          Write-Host "--- launcher imports ---"; $launcherDeps | ForEach-Object { Write-Host "  $_" }
          if ($coreDeps -contains 'vulkan-1.dll') { throw "CUDA core unexpectedly imports vulkan-1.dll" }
          if ($coreDeps | Where-Object { $_ -match '^(vcruntime|msvcp|concrt)' }) {
            throw "CUDA core unexpectedly depends on a dynamic MSVC CRT: $($coreDeps -join ', ')"
          }
          if ($coreDeps | Where-Object { $_ -like 'vcomp*.dll' }) {
            Write-Host "INFO: CUDA core uses MSVC OpenMP; VCOMP will be embedded in the outer single-file payload."
          }
          if (-Not ($coreDeps | Where-Object { $_ -eq 'nvcuda.dll' -or $_ -like 'cublas*.dll' -or $_ -like 'cudart*.dll' })) {
            throw "CUDA core has no CUDA import evidence"
          }
          if ($launcherDeps | Where-Object { $_ -eq 'nvcuda.dll' -or $_ -like 'cublas*.dll' -or $_ -like 'cudart*.dll' -or $_ -like 'nvrtc*.dll' }) {
            throw "Outer launcher must not import CUDA libraries: $($launcherDeps -join ', ')"
          }
          if ($launcherDeps | Where-Object { $_ -match '^(vcruntime|msvcp|vcomp)' }) {
            throw "Outer launcher is not CRT-single-file: $($launcherDeps -join ', ')"
          }
      - name: Build single-file CUDA container
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $core = (Resolve-Path "build\Release\s2-cuda-core.exe").Path
          $launcher = (Resolve-Path "build\Release\s2-cuda-launcher.exe").Path
          $cudaBin = Join-Path $env:CUDA_PATH 'bin'
          if (-Not (Test-Path $cudaBin)) { throw "CUDA bin does not exist: $cudaBin" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -version '[18.0,19.0)' -property installationPath
          $dumpbin = Get-ChildItem "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction Stop |
                     Sort-Object FullName -Descending | Select-Object -First 1
          function Get-PeDependencies([string]$file) {
            @(& $dumpbin.FullName /dependents $file | Select-String -Pattern '^\s+\S+\.dll\s*$' | ForEach-Object { $_.ToString().Trim() })
          }

          Remove-Item cuda-payload, release-cuda -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force cuda-payload, release-cuda | Out-Null
          Copy-Item $core cuda-payload\s2-cuda-core.exe
          $sys32 = Join-Path $env:WINDIR 'System32'
          $queue = [System.Collections.Generic.Queue[string]]::new(); $queue.Enqueue($core)
          $seen = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $copied = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $missing = [System.Collections.Generic.List[string]]::new()

          # cuBLAS may load cuBLASLt dynamically; seed the transitive closure.
          Get-ChildItem $cudaBin -Filter 'cublasLt64_*.dll' -ErrorAction SilentlyContinue | ForEach-Object {
            if ($copied.Add($_.Name)) { Copy-Item $_.FullName (Join-Path cuda-payload $_.Name); $queue.Enqueue($_.FullName) }
          }
          while ($queue.Count -gt 0) {
            $current = $queue.Dequeue(); if (-Not $seen.Add($current)) { continue }
            foreach ($dep in (Get-PeDependencies $current)) {
              $low = $dep.ToLowerInvariant()
              if ($low -eq 'nvcuda.dll') { continue } # driver-owned; never redistribute
              if ($low -like 'api-ms-win-*' -or $low -like 'ext-ms-win-*') { continue }
              if ($low -like 'vcomp*.dll') {
                # /MT does not make MSVC OpenMP static. Microsoft documents VCOMP
                # as redistributable from VC\Redist; embed it beside the extracted core.
                $vcDll = Get-ChildItem (Join-Path $vsRoot 'VC\Redist\MSVC') -Recurse -File -Filter $dep -ErrorAction SilentlyContinue |
                         Where-Object { $_.FullName -match '\\x64\\' -and $_.FullName -notmatch 'debug_nonredist|onecore' } |
                         Sort-Object FullName -Descending | Select-Object -First 1
                if ($vcDll) {
                  if ($copied.Add($dep)) { Copy-Item $vcDll.FullName (Join-Path cuda-payload $dep); $queue.Enqueue($vcDll.FullName) }
                  continue
                }
                $missing.Add("$dep (MSVC OpenMP runtime required by $([IO.Path]::GetFileName($current)))")
                continue
              }
              # Prefer Toolkit redistributables over anything coincidentally present
              # in this runner's System32. Otherwise a polluted CI image could make
              # the bundle omit cuBLAS/nvrtc/etc. and produce an artifact that only
              # works on the runner that built it. nvcuda.dll was excluded above.
              $cudaDll = Join-Path $cudaBin $dep
              if (Test-Path $cudaDll) {
                if ($copied.Add($dep)) { Copy-Item $cudaDll (Join-Path cuda-payload $dep); $queue.Enqueue($cudaDll) }
                continue
              }
              if (Test-Path (Join-Path $sys32 $dep)) { continue }
              $missing.Add("$dep (required by $([IO.Path]::GetFileName($current)))")
            }
          }
          if ($missing.Count) { throw "Unresolved non-system dependencies: $((($missing | Sort-Object -Unique) -join ', '))" }
          if (Test-Path cuda-payload\nvcuda.dll) { throw "nvcuda.dll must never be bundled" }

          python tools/cuda_bundle.py --launcher $launcher --payload-dir cuda-payload --output release-cuda\s2-cuda.exe
          if ($LASTEXITCODE -ne 0) { throw "CUDA bundler failed" }
          $outer = (Resolve-Path release-cuda\s2-cuda.exe).Path
          $outerDeps = Get-PeDependencies $outer | ForEach-Object { $_.ToLowerInvariant() }
          if ($outerDeps | Where-Object { $_ -eq 'nvcuda.dll' -or $_ -like 'cublas*.dll' -or $_ -like 'cudart*.dll' -or $_ -like 'nvrtc*.dll' }) {
            throw "Final outer s2-cuda.exe imports CUDA: $($outerDeps -join ', ')"
          }
          $files = @(Get-ChildItem release-cuda -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 's2-cuda.exe') { throw "CUDA artifact must contain exactly one s2-cuda.exe" }
          Write-Host "OK: single-file CUDA artifact built; nvcuda.dll is supplied by the NVIDIA driver."
      - name: Subir artifact CUDA
        uses: actions/upload-artifact@v7
        with:
          name: s2-windows-cuda
          path: release-cuda/
          retention-days: 30

  build-cpu:
    name: Windows Server 2025 - VS 2026 - CPU only
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verificar toolchain VS 2026
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw "cmake --version failed with exit $LASTEXITCODE" }
          $cmakeHelp = cmake --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $cmakeHelp -notmatch [regex]::Escape("Visual Studio 18 2026")) {
              throw 'Installed CMake does not expose generator "Visual Studio 18 2026" (requires CMake >= 4.2).'
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-Not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vsRoot = & $vswhere -latest -products * -version '[18.0,19.0)' -property installationPath
          if ($LASTEXITCODE -ne 0 -or -Not $vsRoot) { throw "Visual Studio 2026 not found" }
          $cl = Get-ChildItem "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" -ErrorAction Stop |
                Sort-Object FullName -Descending | Select-Object -First 1
          if (-Not $cl) { throw "VS 2026 x64 cl.exe not found" }
          Write-Host "VS2026=$vsRoot"
          Write-Host "cl.exe=$($cl.FullName)"
          Write-Host "cl version=$($cl.VersionInfo.FileVersion)"

      - name: Cache Crow/Asio headers
        uses: actions/cache@v6
        with:
          path: |
            build/_deps/crow-include
            build/_deps/asio-include
          key: crow-asio-${{ runner.os }}-crow1.3.3-asio1.30.2

      - name: Prepare portable CMake/Crow
        shell: pwsh
        run: pwsh -File patch-cmake.ps1

      - name: Generate byte-exact embedded tokenizer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          if ($LASTEXITCODE -ne 0) { throw "Python not available" }
          python tools/embed_tokenizer.py tokenizer.json src/tokenizer_data.cpp src/tokenizer_data.h
          if ($LASTEXITCODE -ne 0) { throw "tokenizer embedding failed" }
          Write-Host "Embedded tokenizer source size: $([math]::Round((Get-Item src/tokenizer_data.cpp).Length/1MB,2)) MB"

      - name: CMake Configure (CPU only)
        shell: pwsh
        run: |
          cmake -G "Visual Studio 18 2026" -A x64 -B build-cpu -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DS2_VULKAN=OFF `
            -DS2_CUDA=OFF `
            -DS2_METAL=OFF `
            -DGGML_VULKAN=OFF `
            -DGGML_CUDA=OFF `
            -DGGML_METAL=OFF `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_AVX512=OFF

      - name: CMake Build (CPU only)
        shell: pwsh
        run: cmake --build build-cpu --config Release --parallel

      - name: Verify CPU-only executable
        shell: pwsh
        run: |
          $exe = "build-cpu\Release\s2.exe"
          if (-Not (Test-Path $exe)) { Write-Error "CPU s2.exe was not generated"; exit 1 }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot  = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
                     Select-Object -First 1
          if (-Not $dumpbin) { Write-Error "dumpbin not found"; exit 1 }
          $deps = & $dumpbin.FullName /dependents $exe |
                  Select-String -Pattern '^\s+\S+\.dll\s*$' |
                  ForEach-Object { $_.ToString().Trim().ToLower() }
          if ($deps -contains 'vulkan-1.dll' -or $deps -contains 'nvcuda.dll' -or
              ($deps | Where-Object { $_ -like 'cublas*.dll' -or $_ -like 'cudart*.dll' -or $_ -like 'nvrtc*.dll' })) {
              Write-Error "CPU artifact unexpectedly links a GPU runtime: $($deps -join ', ')"
              exit 1
          }
          if ($deps | Where-Object { $_ -match '^(vcruntime|msvcp|concrt)' }) {
              Write-Error "CPU artifact unexpectedly uses the dynamic MSVC CRT despite /MT: $($deps -join ', ')"
              exit 1
          }
          if ($deps | Where-Object { $_ -like 'vcomp*.dll' }) {
              Write-Host "INFO: CPU artifact keeps OpenMP performance and therefore requires the VC++ v14 x64 Redistributable (VCOMP)."
          }

          & $exe --help 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "CPU executable failed --help"; exit 1 }
          Write-Host "OK: CPU-only executable has no GPU imports, no dynamic normal CRT, and starts successfully."

      - name: Package CPU release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-cpu | Out-Null
          Copy-Item build-cpu\Release\s2.exe release-cpu\s2-cpu.exe
          if (Test-Path release-cpu\tokenizer.json) { Remove-Item release-cpu\tokenizer.json -Force }
          Write-Host "OK: tokenizer is embedded; CPU artifact contains only s2-cpu.exe"

      - name: Upload CPU artifact
        uses: actions/upload-artifact@v7
        with:
          name: s2-windows-cpu
          path: release-cpu/
          retention-days: 30

  build-metal:
    name: macOS - Clang - Metal
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verificar toolchain Metal
        shell: bash
        run: |
          set -euo pipefail
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          sw_vers
          uname -m
          cmake --version
          xcodebuild -version
          clang++ --version

      - name: Fetch header-only Crow and Asio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-deps
          curl -fL --retry 3 \
            https://github.com/CrowCpp/Crow/archive/refs/tags/v1.3.3.tar.gz \
            -o build-deps/crow.tar.gz
          tar -xzf build-deps/crow.tar.gz -C build-deps

          curl -fL --retry 3 \
            https://github.com/chriskohlhoff/asio/archive/refs/tags/asio-1-30-2.tar.gz \
            -o build-deps/asio.tar.gz
          tar -xzf build-deps/asio.tar.gz -C build-deps

          test -f build-deps/Crow-1.3.3/include/crow.h
          test -f build-deps/asio-asio-1-30-2/asio/include/asio.hpp

      - name: Generate byte-exact embedded tokenizer
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 tools/embed_tokenizer.py tokenizer.json src/tokenizer_data.cpp src/tokenizer_data.h
          ls -lh src/tokenizer_data.cpp src/tokenizer_data.h

      - name: CMake Configure (Metal only)
        shell: bash
        run: |
          set -euo pipefail
          cmake -B build-metal -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DS2_VULKAN=OFF \
            -DS2_CUDA=OFF \
            -DS2_METAL=ON \
            -DGGML_VULKAN=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DS2_CROW_INCLUDE_DIR="$PWD/build-deps/Crow-1.3.3/include" \
            -DS2_ASIO_INCLUDE_DIR="$PWD/build-deps/asio-asio-1-30-2/asio/include"

      - name: CMake Build (Metal)
        shell: bash
        run: cmake --build build-metal --parallel

      - name: Verify Metal executable
        shell: bash
        run: |
          set -euo pipefail
          exe=build-metal/s2
          test -x "$exe"
          "$exe" --help >/dev/null

          # Static linking can hide framework names from a naive filename check,
          # so verify the actual Metal backend symbol is present in the executable.
          symbols="$(nm "$exe")"
          if ! grep -q 'ggml_backend_metal_init' <<<"$symbols"; then
            echo "Metal backend symbol is missing from the artifact" >&2
            exit 1
          fi
          if grep -Eq 'ggml_backend_cuda_init|ggml_backend_vk_init' <<<"$symbols"; then
            echo "Metal artifact unexpectedly contains CUDA/Vulkan backend symbols" >&2
            exit 1
          fi
          echo "OK: Metal backend present and CUDA/Vulkan backends absent."

      - name: Package Metal release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-metal
          cp build-metal/s2 release-metal/s2-metal
          chmod +x release-metal/s2-metal
          test "$(find release-metal -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1"
          # Package the executable itself (not the release-metal directory) so the
          # published ZIP extracts directly to ./s2-metal, matching README/--help.
          # ditto preserves the executable mode in the ZIP.
          ditto -c -k --keepParent release-metal/s2-metal s2-macos-metal.zip
          rm -rf verify-metal-zip
          mkdir verify-metal-zip
          ditto -x -k s2-macos-metal.zip verify-metal-zip
          test -f verify-metal-zip/s2-metal
          test -x verify-metal-zip/s2-metal
          test "$(find verify-metal-zip -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1"

      - name: Upload Metal artifact
        uses: actions/upload-artifact@v7
        with:
          name: s2-macos-metal
          path: s2-macos-metal.zip
          retention-days: 30

  release:
    name: Publish all backend release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-cuda, build-cpu, build-metal]
    runs-on: windows-2025-vs2026
    permissions:
      contents: write

    steps:
      - name: Download Vulkan artifact
        uses: actions/download-artifact@v8
        with:
          name: s2-windows-vulkan
          path: artifacts/vulkan

      - name: Download CUDA artifact
        uses: actions/download-artifact@v8
        with:
          name: s2-windows-cuda
          path: artifacts/cuda

      - name: Download CPU artifact
        uses: actions/download-artifact@v8
        with:
          name: s2-windows-cpu
          path: artifacts/cpu

      - name: Download Metal artifact
        uses: actions/download-artifact@v8
        with:
          name: s2-macos-metal
          path: artifacts/metal

      - name: Create release ZIPs
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          Compress-Archive -Path artifacts\vulkan\* -DestinationPath "s2-$tag-windows-vulkan.zip"
          Compress-Archive -Path artifacts\cuda\*   -DestinationPath "s2-$tag-windows-cuda.zip"
          Compress-Archive -Path artifacts\cpu\*    -DestinationPath "s2-$tag-windows-cpu.zip"
          $metalZip = Get-ChildItem artifacts\metal\s2-macos-metal.zip | Select-Object -First 1
          if (-Not $metalZip) { Write-Error "Metal release ZIP is missing"; exit 1 }
          Copy-Item $metalZip.FullName "s2-$tag-macos-metal.zip"

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            s2-*-windows-vulkan.zip
            s2-*-windows-cuda.zip
            s2-*-windows-cpu.zip
            s2-*-macos-metal.zip
          generate_release_notes: true
