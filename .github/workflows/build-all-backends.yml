  build-linux-cuda:
    name: Linux x86_64 - CUDA 13.2 / Rocky 8 baseline (glibc 2.28)
    runs-on: ubuntu-24.04
    needs: preflight
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Reclaim runner disk space
        shell: bash
        run: bash tools/ci/reclaim-linux-runner-space.sh

      - name: Prepare Crow/Asio/tokenizer
        shell: bash
        run: bash tools/ci/prepare-linux-deps.sh common

      - name: Build portable CUDA 13.2 on Rocky Linux 8 baseline
        shell: bash
        run: |
          set -euo pipefail
          image=nvidia/cuda:13.2.0-devel-rockylinux8
          docker pull "$image"
          docker image inspect "$image" --format 'RepoDigests={{json .RepoDigests}}'
          python3 tools/ci/run-with-diagnostics.py --label "Linux CUDA portable build" --log ci-logs/linux-cuda-build.log -- \
            docker run --rm --platform linux/amd64 \
              -e S2_BUILD_JOBS=2 \
              -v "$PWD:/src" -w /src \
              "$image" /bin/bash -lc '
                set -euo pipefail
                cat /etc/os-release
                ldd --version | sed -n '1p'
                dnf -y install python39 python39-pip make file binutils gcc gcc-c++ >/dev/null
                python3.9 -m pip install --no-cache-dir "cmake==4.4.3" >/dev/null
                export PATH="/usr/local/bin:$PATH"
                gcc --version | sed -n '1p'
                nvcc --version
                cmake --version
                bash tools/ci/build-linux-portable.sh cuda
              '

      - name: Inspect CUDA release
        shell: bash
        run: |
          set -euo pipefail
          test -x s2-linux-cuda-x86-64
          ./s2-linux-cuda-x86-64 --runtime-info
          cuda_dynamic="$(readelf -d release-linux-cuda/s2-cuda)"
          if grep -Eq 'lib(cudart|cublas|cublasLt|nvJitLink)\.so' <<<"$cuda_dynamic"; then
            echo 'CUDA Toolkit shared library unexpectedly leaked into Linux release' >&2
            exit 1
          fi

      - name: Verify non-empty direct artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s s2-linux-cuda-x86-64

      - name: Upload Linux CUDA artifact
        uses: actions/upload-artifact@v7
        with:
          name: s2-linux-cuda-x86-64
          path: s2-linux-cuda-x86-64
          if-no-files-found: error
          archive: false


      - name: Collect robust crash report
        if: failure()
        shell: bash
        run: python3 tools/ci/collect-crash-report.py --label "Linux CUDA" --logs ci-logs --output ci-logs/job-crash-report.txt

      - name: Upload concise failure diagnostics
        if: ${{ failure() && hashFiles('ci-logs/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-cuda-diagnostics
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  build-metal:
    name: macOS arm64 - Clang - Metal
    runs-on: macos-15
    needs: preflight
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Pin Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_16.4.app/Contents/Developer
          test "$(uname -m)" = "arm64"
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun --show-sdk-path
          xcrun --sdk macosx --show-sdk-version

      - name: Verificar toolchain Metal
        shell: bash
        run: |
          set -euo pipefail
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          sw_vers
          uname -m
          cmake --version
          xcodebuild -version
          clang++ --version

      - name: Fetch pinned header-only Crow and Asio
        shell: bash
        run: |
          set -euo pipefail
          crow_commit=ae0fef0ee67eec897e401321b99b6dd7cfbdc155
          asio_sha256=755bd7f85a4b269c67ae0ea254907c078d408cce8e1a352ad2ed664d233780e8
          rm -rf build-deps
          mkdir -p build-deps/crow build-deps/asio

          curl -fL --retry 3 \
            "https://github.com/CrowCpp/Crow/archive/${crow_commit}.tar.gz" \
            -o build-deps/crow.tar.gz
          tar -xzf build-deps/crow.tar.gz -C build-deps/crow --strip-components=1
          grep -Eq 'VERSION[[:space:]]+1\.3\.4' build-deps/crow/CMakeLists.txt

          curl -fL --retry 3 \
            https://github.com/chriskohlhoff/asio/archive/refs/tags/asio-1-30-2.tar.gz \
            -o build-deps/asio.tar.gz
          printf '%s  %s\n' "$asio_sha256" build-deps/asio.tar.gz | shasum -a 256 -c -
          tar -xzf build-deps/asio.tar.gz -C build-deps/asio --strip-components=1

          test -f build-deps/crow/include/crow.h
          test -f build-deps/asio/asio/include/asio.hpp

      - name: Generate byte-exact embedded tokenizer
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 tools/embed_tokenizer.py tokenizer.json src/tokenizer_data.cpp src/tokenizer_data.h
          ls -lh src/tokenizer_data.cpp src/tokenizer_data.h

      - name: CMake Configure (Metal only)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/run-with-diagnostics.py --label "macOS Metal configure" --log ci-logs/macos-metal-configure.log -- cmake -B build-metal -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DS2_VULKAN=OFF \
            -DS2_CUDA=OFF \
            -DS2_METAL=ON \
            -DGGML_VULKAN=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DS2_CROW_INCLUDE_DIR="$PWD/build-deps/crow/include" \
            -DS2_ASIO_INCLUDE_DIR="$PWD/build-deps/asio/asio/include"

      - name: CMake Build (Metal)
        shell: bash
        run: python3 tools/ci/run-with-diagnostics.py --label "macOS Metal build" --log ci-logs/macos-metal-build.log -- cmake --build build-metal --parallel 2

      - name: Verify Metal executable
        shell: bash
        run: |
          set -euo pipefail
          exe=build-metal/s2-metal
          test -x "$exe"
          "$exe" --help >/dev/null

          # Static linking can hide framework names from a naive filename check,
          # so verify the actual Metal backend symbol is present in the executable.
          symbols="$(nm "$exe")"
          if ! grep -q 'ggml_backend_metal_init' <<<"$symbols"; then
            echo "Metal backend symbol is missing from the artifact" >&2
            exit 1
          fi
          if grep -Eq 'ggml_backend_cuda_init|ggml_backend_vk_init' <<<"$symbols"; then
            echo "Metal artifact unexpectedly contains CUDA/Vulkan backend symbols" >&2
            exit 1
          fi
          echo "OK: Metal backend present and CUDA/Vulkan backends absent."

      - name: Package Metal release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-metal
          mkdir -p release-metal
          cp build-metal/s2-metal release-metal/s2-macos-metal-arm64
          chmod +x release-metal/s2-macos-metal-arm64
          test "$(find release-metal -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1"
          test -x release-metal/s2-macos-metal-arm64

      - name: Verify non-empty direct artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s release-metal/s2-macos-metal-arm64

      - name: Upload Metal artifact
        uses: actions/upload-artifact@v7
        with:
          name: s2-macos-metal-arm64
          path: release-metal/s2-macos-metal-arm64
          if-no-files-found: error
          archive: false


      - name: Collect robust crash report
        if: failure()
        shell: bash
        run: python3 tools/ci/collect-crash-report.py --label "macOS Metal" --logs ci-logs --output ci-logs/job-crash-report.txt

      - name: Upload concise failure diagnostics
        if: ${{ failure() && hashFiles('ci-logs/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-metal-diagnostics
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  build-windows-amd:
    name: Windows Server 2025 - AMD (ROCm/HIP 7.14.1)
    runs-on: windows-2025-vs2026
    needs: preflight
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify Windows ROCm runner image
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH RUNNER_NAME=$env:RUNNER_NAME"
          if ($env:RUNNER_ARCH -ne 'X64') { throw "Windows ROCm build requires an x64 runner, got $env:RUNNER_ARCH" }
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw "cmake --version failed" }
          ninja --version
          if ($LASTEXITCODE -ne 0) { throw "ninja --version failed" }

      - name: Setup Python 3.12 for ROCm wheels
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          check-latest: false

      - name: Prepare Crow/Asio
        shell: pwsh
        run: pwsh -File patch-cmake.ps1 -SkipVulkanPortabilityPatch

      - name: Generate embedded tokenizer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/embed_tokenizer.py tokenizer.json src/tokenizer_data.cpp src/tokenizer_data.h
          if ($LASTEXITCODE -ne 0) { throw "tokenizer embedding failed" }

      - name: Install ROCm SDK 7.14.1 build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://repo.amd.com/rocm/whl-multi-arch/ "rocm[libraries,devel,device-gfx1030,device-gfx1100,device-gfx1101,device-gfx1102,device-gfx1103,device-gfx1150,device-gfx1151,device-gfx1152,device-gfx1153,device-gfx1200,device-gfx1201]==7.14.1"
          if ($LASTEXITCODE -ne 0) { throw "ROCm pip SDK install failed" }
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          if ($LASTEXITCODE -ne 0 -or -Not $scripts) { throw "Unable to resolve Python scripts directory" }
          $env:PATH = "$scripts;$env:PATH"
          rocm-sdk init
          if ($LASTEXITCODE -ne 0) { throw "rocm-sdk init failed" }
          rocm-sdk targets
          if ($LASTEXITCODE -ne 0) { throw "rocm-sdk targets failed" }
          $rocm = (& rocm-sdk path --root).Trim()
          $cmakePrefix = (& rocm-sdk path --cmake).Trim()
          $rocmBin = (& rocm-sdk path --bin).Trim()
          if ($LASTEXITCODE -ne 0 -or -Not $rocm -or -Not (Test-Path $rocm)) { throw "rocm-sdk path --root failed" }
          if (-Not $cmakePrefix -or -Not (Test-Path $cmakePrefix)) { throw "rocm-sdk path --cmake failed: $cmakePrefix" }
          if (-Not $rocmBin -or -Not (Test-Path $rocmBin)) { throw "rocm-sdk path --bin failed: $rocmBin" }
          $llvmBin = Join-Path $rocm 'lib\llvm\bin'
          $clang = Join-Path $llvmBin 'clang++.exe'
          if (-Not (Test-Path $clang)) { throw "ROCm clang++.exe not found: $clang" }
          $deviceLib = Join-Path $rocm 'lib\llvm\amdgcn\bitcode'
          if (-Not (Test-Path (Join-Path $deviceLib 'oclc_abi_version_400.bc'))) { throw "ROCm device bitcode missing: $deviceLib" }
          $hipHeader = Get-ChildItem $rocm -Recurse -File -Filter 'hip_runtime.h' -ErrorAction Stop |
            Where-Object { $_.FullName -match '[\\/]hip[\\/]hip_runtime\.h$' } |
            Select-Object -First 1
          if (-Not $hipHeader) { throw "ROCm HIP header hip/hip_runtime.h not found under $rocm" }
          $hipInclude = Split-Path -Parent (Split-Path -Parent $hipHeader.FullName)
          if (-Not (Test-Path (Join-Path $hipInclude 'hip\hip_runtime.h'))) { throw "Invalid ROCm HIP include root: $hipInclude" }
          "ROCM_PATH=$rocm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HIP_PATH=$rocm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HIP_PLATFORM=amd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HIP_DEVICE_LIB_PATH=$deviceLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ROCM_LLVM_BIN=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ROCM_BIN=$rocmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ROCM_CMAKE_PREFIX=$cmakePrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "S2_HIP_INCLUDE=$hipInclude" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ROCM_PATH=$rocm"
          Write-Host "ROCM_BIN=$rocmBin"
          Write-Host "CMAKE_PREFIX_PATH=$cmakePrefix"
          Write-Host "HIP_DEVICE_LIB_PATH=$deviceLib"
          Write-Host "S2_HIP_INCLUDE=$hipInclude"
          Get-PSDrive -Name C | Format-Table Name,Used,Free -AutoSize

      - name: Pin MSVC 14.44 headers and libraries for ROCm HIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # ROCm 7.14.1's bundled Clang/HIP conflicts with VS 2026 MSVC 14.51
          # <cmath>. Select the x64 14.44 compatibility toolset explicitly.
          $vsRoot = 'C:\Program Files\Microsoft Visual Studio\18\Enterprise'
          $vcRoot = Join-Path $vsRoot 'VC\Tools\MSVC'
          if (-Not (Test-Path $vcRoot)) { throw "MSVC tools root not found: $vcRoot" }
          $vc = Get-ChildItem $vcRoot -Directory |
            Where-Object { $_.Name -like '14.44.*' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-Not $vc) { throw "MSVC 14.44 x64 compatibility toolset is not installed on this runner" }

          $kitsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $sdkLibRoot = Join-Path $kitsRoot 'Lib'
          $sdk = Get-ChildItem $sdkLibRoot -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'ucrt\x64') } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-Not $sdk) { throw "No x64 Windows SDK libraries found under $sdkLibRoot" }
          $sdkVersion = $sdk.Name
          $sdkInclude = Join-Path $kitsRoot "Include\$sdkVersion"
          $sdkBin = Join-Path $kitsRoot "bin\$sdkVersion\x64"
          $vcBin = Join-Path $vc.FullName 'bin\Hostx64\x64'
          $include = @(
            (Join-Path $vc.FullName 'include'),
            (Join-Path $sdkInclude 'ucrt'),
            (Join-Path $sdkInclude 'shared'),
            (Join-Path $sdkInclude 'um'),
            (Join-Path $sdkInclude 'winrt'),
            (Join-Path $sdkInclude 'cppwinrt')
          ) -join ';'
          $lib = @(
            (Join-Path $vc.FullName 'lib\x64'),
            (Join-Path $kitsRoot "Lib\$sdkVersion\ucrt\x64"),
            (Join-Path $kitsRoot "Lib\$sdkVersion\um\x64")
          ) -join ';'

          foreach ($required in @($vcBin, (Join-Path $vc.FullName 'include'), (Join-Path $vc.FullName 'lib\x64'), (Join-Path $sdkInclude 'ucrt'), (Join-Path $kitsRoot "Lib\$sdkVersion\ucrt\x64"))) {
            if (-Not (Test-Path $required)) { throw "Required MSVC/SDK path missing: $required" }
          }

          "S2_MSVC_TOOLSET=$($vc.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCToolsInstallDir=$($vc.FullName)\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCToolsVersion=$($vc.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WindowsSdkDir=$kitsRoot\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WindowsSDKVersion=$sdkVersion\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INCLUDE=$include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$vcBin;$sdkBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Write-Host "Pinned HIP host toolset: MSVC $($vc.Name)"
          Write-Host "Windows SDK: $sdkVersion"
          & (Join-Path $vcBin 'cl.exe') 2>&1 | Select-Object -First 4

      - name: Probe Windows ROCm HIP compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force ci-probes | Out-Null
          @('#include <hip/hip_runtime.h>', '__global__ void s2_probe_kernel(int *p) { if (threadIdx.x == 0) *p = 1; }', 'int main() { return 0; }') | Set-Content -Encoding utf8 ci-probes/hip-smoke.cpp
          $clangxx = Join-Path $env:ROCM_LLVM_BIN 'clang++.exe'
          $env:PATH = "$env:ROCM_BIN;$env:ROCM_LLVM_BIN;$env:PATH"
          if ($env:S2_MSVC_TOOLSET -notlike '14.44.*') { throw "ROCm HIP must use pinned MSVC 14.44 headers; got '$env:S2_MSVC_TOOLSET'" }
          Write-Host "HIP host toolset: $env:S2_MSVC_TOOLSET"
          Write-Host "INCLUDE=$env:INCLUDE"
          python tools/ci/run-with-diagnostics.py --label "Windows ROCm compiler probe" --log ci-logs/windows-rocm-compiler-probe.log -- `
            $clangxx -x hip --offload-arch=gfx1030 --offload-arch=gfx1153 --offload-arch=gfx1201 `
            -c ci-probes/hip-smoke.cpp -o ci-probes/hip-smoke.obj
          if (-Not (Test-Path ci-probes/hip-smoke.obj -PathType Leaf)) { throw "Windows ROCm compiler probe did not produce an object" }

      - name: Configure Windows ROCm
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $crow = (Resolve-Path 'build\_deps\crow-include').Path
          $asio = (Resolve-Path 'build\_deps\asio-include').Path
          $clang = Join-Path $env:ROCM_LLVM_BIN 'clang.exe'
          $clangxx = Join-Path $env:ROCM_LLVM_BIN 'clang++.exe'
          if (-Not (Test-Path $clang) -or -Not (Test-Path $clangxx)) { throw "ROCm clang toolchain missing under $env:ROCM_LLVM_BIN" }
          $env:PATH = "$env:ROCM_BIN;$env:ROCM_LLVM_BIN;$env:PATH"
          python tools/ci/run-with-diagnostics.py --label "Windows ROCm configure" --log ci-logs/windows-rocm-configure.log -- cmake -G Ninja -B build-rocm -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$clang" `
            -DCMAKE_CXX_COMPILER="$clangxx" `
            -DCMAKE_HIP_COMPILER="$clang" `
            -DCMAKE_PREFIX_PATH="$env:ROCM_CMAKE_PREFIX" `
            -DS2_CROW_INCLUDE_DIR="$crow" `
            -DS2_ASIO_INCLUDE_DIR="$asio" `
            -DS2_HIP_INCLUDE_DIR="$env:S2_HIP_INCLUDE" `
            -DS2_HIP=ON -DS2_VULKAN=OFF -DS2_CUDA=OFF -DS2_METAL=OFF `
            -DGGML_HIP=ON -DGGML_STATIC=OFF -DGGML_NATIVE=OFF -DGGML_AVX512=OFF `
            "-DGPU_TARGETS=gfx1030;gfx1100;gfx1101;gfx1102;gfx1103;gfx1150;gfx1151;gfx1152;gfx1153;gfx1200;gfx1201"

      - name: Build Windows ROCm
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "$env:ROCM_BIN;$env:ROCM_LLVM_BIN;$env:PATH"
          python tools/ci/run-with-diagnostics.py --label "Windows ROCm build" --log ci-logs/windows-rocm-build.log -- cmake --build build-rocm --parallel 2 --verbose

      - name: Package and audit Windows ROCm runtime closure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = 'build-rocm\s2-amd-core.exe'
          $launcher = 'build-rocm\s2-amd-launcher.exe'
          if (-Not (Test-Path $exe)) { throw "s2-amd-core.exe not generated" }
          if (-Not (Test-Path $launcher)) { throw "s2-amd-launcher.exe not generated" }
          Remove-Item release-rocm -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force release-rocm | Out-Null
          Copy-Item $exe release-rocm\s2-amd-core.exe

          # HIP cannot be linked fully static in current GGML. Ship every GGML
          # DLL produced by this build, then resolve its ROCm DLL imports recursively.
          $ggmlDlls = @(Get-ChildItem build-rocm -Recurse -File -Filter '*.dll' | Where-Object { $_.Name -match '^ggml.*\.dll$' })
          if (-Not ($ggmlDlls | Where-Object { $_.Name -match '^ggml-hip.*\.dll$' })) { throw "GGML HIP DLL was not produced" }
          foreach ($dll in $ggmlDlls) { Copy-Item $dll.FullName (Join-Path release-rocm $dll.Name) -Force }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-Not $vsRoot) { throw "Visual Studio C++ tools not found while auditing ROCm package" }
          $dumpbin = Get-ChildItem "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction Stop |
                     Sort-Object FullName -Descending | Select-Object -First 1
          function Get-Deps([string]$file) {
            @(& $dumpbin.FullName /dependents $file | Select-String -Pattern '^\s+\S+\.dll\s*$' | ForEach-Object { $_.ToString().Trim() })
          }
          $system = Join-Path $env:WINDIR 'System32'
          # Prefer the canonical merged ROCm bin tree. Fall back to the SDK root
          # only for DLLs that are not exposed there.
          $rocmDlls = @()
          $rocmDlls += @(Get-ChildItem $env:ROCM_BIN -Recurse -File -Filter '*.dll' -ErrorAction Stop)
          $rocmDlls += @(Get-ChildItem $env:ROCM_PATH -Recurse -File -Filter '*.dll' -ErrorAction Stop)
          $rocmByName = @{}
          foreach ($dll in $rocmDlls) {
            $key = $dll.Name.ToLowerInvariant()
            if (-Not $rocmByName.ContainsKey($key)) { $rocmByName[$key] = $dll.FullName }
          }
          $queue = [System.Collections.Generic.Queue[string]]::new()
          Get-ChildItem release-rocm -File -Filter '*.exe' | ForEach-Object { $queue.Enqueue($_.FullName) }
          Get-ChildItem release-rocm -File -Filter '*.dll' | ForEach-Object { $queue.Enqueue($_.FullName) }
          $seen = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $missing = [System.Collections.Generic.List[string]]::new()
          while ($queue.Count -gt 0) {
            $current = $queue.Dequeue()
            if (-Not $seen.Add($current)) { continue }
            foreach ($dep in (Get-Deps $current)) {
              $low = $dep.ToLowerInvariant()
              $local = Join-Path release-rocm $dep
              if (Test-Path $local) { $queue.Enqueue((Resolve-Path $local).Path); continue }
              if ($low -like 'api-ms-win-*' -or $low -like 'ext-ms-win-*' -or (Test-Path (Join-Path $system $dep))) { continue }
              if ($rocmByName.ContainsKey($low)) {
                Copy-Item $rocmByName[$low] $local -Force
                $queue.Enqueue((Resolve-Path $local).Path)
                continue
              }
              $missing.Add("$dep <- $([IO.Path]::GetFileName($current))")
            }
          }
          if ($missing.Count) { throw "Unresolved Windows ROCm dependency closure: $((($missing | Sort-Object -Unique) -join ', '))" }

          # rocBLAS/hipBLASLt load architecture-specific kernel blobs at runtime.
          # The multi-arch wheels may expose these below the merged bin tree or
          # deeper in the SDK root, so discover them instead of assuming one path.
          foreach ($tree in @('rocblas','hipblaslt')) {
            $direct = Join-Path $env:ROCM_BIN "$tree\library"
            if (Test-Path $direct -PathType Container) {
              $candidates = @((Get-Item $direct))
            } else {
              $candidates = @(Get-ChildItem $env:ROCM_PATH -Recurse -Directory -Filter 'library' -ErrorAction Stop |
                               Where-Object { $_.Parent.Name -ieq $tree } |
                               Sort-Object FullName -Unique)
            }
            if ($candidates.Count -gt 1) {
              throw "Ambiguous $tree kernel-library layout: $($candidates.FullName -join ', ')"
            }
            if ($candidates.Count -eq 1) {
              $dst = Join-Path release-rocm "$tree\library"
              New-Item -ItemType Directory -Force $dst | Out-Null
              Copy-Item (Join-Path $candidates[0].FullName '*') $dst -Recurse -Force
            }
          }
          if (-Not (Test-Path 'release-rocm\rocblas\library')) { throw "rocBLAS kernel library directory is missing" }

          # Some ROCm components are loaded dynamically rather than appearing in
          # the PE import table. Copy/check the known runtime anchors explicitly.
          foreach ($need in @('amdhip64_7.dll','amd_comgr.dll','hipblas.dll','libhipblaslt.dll','rocblas.dll','rocsolver.dll','rocm_kpack.dll')) {
            $dst = Join-Path 'release-rocm' $need
            if (-Not (Test-Path $dst)) {
              $key = $need.ToLowerInvariant()
              if ($rocmByName.ContainsKey($key)) { Copy-Item $rocmByName[$key] $dst -Force }
            }
            if (-Not (Test-Path $dst)) { throw "Required ROCm runtime DLL missing: $need" }
          }
          Set-Content release-rocm\ROCM_RUNTIME.txt "ROCm 7.14.1 multi-arch runtime. AMD Adrenalin display driver is still required. Vulkan is the compatibility fallback."
          Write-Host "--- Windows AMD runtime payload ---"
          Get-ChildItem release-rocm -Recurse | Select-Object FullName,Length
          Remove-Item release-amd -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force release-amd | Out-Null
          python tools/cuda_bundle.py --launcher $launcher --payload-dir release-rocm --core-name s2-amd-core.exe --output release-amd\s2-windows-amd-x86-64.exe
          if ($LASTEXITCODE -ne 0) { throw "AMD runtime bundler failed" }
          $outer = (Resolve-Path release-amd\s2-windows-amd-x86-64.exe).Path
          $runtimeInfo = @(& $outer --runtime-info 2>&1 | ForEach-Object { $_.ToString() })
          if ($LASTEXITCODE -ne 0) { throw "Final AMD executable --runtime-info validation failed" }
          $runtimeText = $runtimeInfo -join "`n"
          Write-Host $runtimeText
          if ($runtimeText -notmatch '(?m)^payload_files:\s+[1-9][0-9]*\s*$') { throw "AMD runtime-info did not report a non-empty payload" }
          if ($runtimeText -notmatch '(?m)^\s+s2-amd-core\.exe\s+') { throw "AMD runtime-info is missing s2-amd-core.exe" }
          $files = @(Get-ChildItem release-amd -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 's2-windows-amd-x86-64.exe') { throw "AMD artifact must contain exactly one s2-windows-amd-x86-64.exe" }
          $bytes = (Get-Item $outer).Length
          $mb = [math]::Round($bytes / 1MB, 1)
          Write-Host "Windows AMD single-file size: $mb MB"
          if ($bytes -ge 1900MB) { throw "Windows AMD executable is too close to GitHub Release 2 GiB per-asset limit; split runtime by GPU family" }
          Get-PSDrive -Name C | Format-Table Name,Used,Free -AutoSize

      - name: Verify non-empty direct artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $f = Get-Item 'release-amd/s2-windows-amd-x86-64.exe'
          if ($f.Length -le 0) { throw "Direct artifact is empty: $($f.FullName)" }

      - name: Upload Windows AMD artifact
        uses: actions/upload-artifact@v7
        with:
          name: s2-windows-amd-x86-64.exe
          path: release-amd/s2-windows-amd-x86-64.exe
          if-no-files-found: error
          archive: false


      - name: Collect robust crash report
        if: failure()
        shell: pwsh
        run: python tools/ci/collect-crash-report.py --label "Windows AMD" --logs ci-logs --output ci-logs/job-crash-report.txt

      - name: Upload concise failure diagnostics
        if: ${{ failure() && hashFiles('ci-logs/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-amd-diagnostics
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  build-linux-amd:
    name: Linux x86_64 - AMD (ROCm/HIP 7.14.1, Ubuntu 22.04 ABI container)
    # Keep the hosted runner current while preserving the older userspace ABI.
    # GitHub is deprecating the ubuntu-22.04 hosted label; the job itself runs
    # in a pinned Ubuntu 22.04 container on the ubuntu-24.04 host.
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    needs: preflight
    timeout-minutes: 180

    steps:
      - name: Bootstrap Ubuntu 22.04 ROCm build container
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git tar gzip xz-utils build-essential libgfortran5 libnuma1 python3 python3-venv python3-pip
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare pinned Linux Crow/Asio dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/prepare-linux-deps.sh common

      - name: Install ROCm SDK 7.14.1
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/rocm-venv"
          "$RUNNER_TEMP/rocm-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir 'cmake==4.4.3' ninja
          "$RUNNER_TEMP/rocm-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --index-url https://repo.amd.com/rocm/whl-multi-arch/ 'rocm[libraries,devel,device-gfx1030,device-gfx1100,device-gfx1101,device-gfx1102,device-gfx1103,device-gfx1150,device-gfx1151,device-gfx1152,device-gfx1153,device-gfx1200,device-gfx1201]==7.14.1'
          export PATH="$RUNNER_TEMP/rocm-venv/bin:$PATH"
          rocm-sdk init
          rocm-sdk targets
          rocm_root="$(rocm-sdk path --root)"
          cmake_prefix="$(rocm-sdk path --cmake)"
          rocm_bin="$(rocm-sdk path --bin)"
          test -d "$rocm_root" && test -d "$cmake_prefix" && test -d "$rocm_bin"
          llvm_bin="$rocm_root/lib/llvm/bin"
          device_lib="$rocm_root/lib/llvm/amdgcn/bitcode"
          test -x "$llvm_bin/clang++"
          test -f "$device_lib/oclc_abi_version_400.bc"
          echo "ROCM_PATH=$rocm_root" >> "$GITHUB_ENV"
          echo "ROCM_CMAKE_PREFIX=$cmake_prefix" >> "$GITHUB_ENV"
          echo "ROCM_BIN=$rocm_bin" >> "$GITHUB_ENV"
          echo "ROCM_LLVM_BIN=$llvm_bin" >> "$GITHUB_ENV"
          echo "HIP_DEVICE_LIB_PATH=$device_lib" >> "$GITHUB_ENV"
          echo "HIP_PATH=$rocm_root" >> "$GITHUB_ENV"
          echo "HIP_PLATFORM=amd" >> "$GITHUB_ENV"
          echo "ROCM_VENV=$RUNNER_TEMP/rocm-venv" >> "$GITHUB_ENV"
          df -h . "$RUNNER_TEMP"

      - name: Probe Linux ROCm HIP compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-probes
          printf '%s\n' '#include <hip/hip_runtime.h>' '__global__ void s2_probe_kernel(int *p) { if (threadIdx.x == 0) *p = 1; }' 'int main() { return 0; }' > ci-probes/hip-smoke.cpp
          export PATH="$ROCM_VENV/bin:$ROCM_BIN:$ROCM_LLVM_BIN:$PATH"
          export LD_LIBRARY_PATH="$ROCM_PATH/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 tools/ci/run-with-diagnostics.py --label "Linux ROCm compiler probe" --log ci-logs/linux-rocm-compiler-probe.log -- \
            "$ROCM_LLVM_BIN/clang++" -x hip --offload-arch=gfx1030 --offload-arch=gfx1153 --offload-arch=gfx1201 \
            -c ci-probes/hip-smoke.cpp -o ci-probes/hip-smoke.o
          test -s ci-probes/hip-smoke.o

      - name: Configure Linux ROCm
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ROCM_VENV/bin:$ROCM_BIN:$ROCM_LLVM_BIN:$PATH"
          export LD_LIBRARY_PATH="$ROCM_PATH/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          crow="$(realpath build-linux-deps/crow/include)"
          asio="$(realpath build-linux-deps/asio/include)"
          cxx="$ROCM_LLVM_BIN/clang++"
          cc="$ROCM_LLVM_BIN/clang"
          test -x "$cxx" && test -x "$cc"
          python3 tools/ci/run-with-diagnostics.py --label "Linux ROCm configure" --log ci-logs/linux-rocm-configure.log -- cmake -G Ninja -B build-rocm -S . \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER="$cc" -DCMAKE_CXX_COMPILER="$cxx" -DCMAKE_HIP_COMPILER="$cc" \
            '-DCMAKE_BUILD_RPATH=$ORIGIN' '-DCMAKE_INSTALL_RPATH=$ORIGIN' -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_PREFIX_PATH="$ROCM_CMAKE_PREFIX" -DS2_CROW_INCLUDE_DIR="$crow" -DS2_ASIO_INCLUDE_DIR="$asio" \
            -DS2_HIP=ON -DS2_VULKAN=OFF -DS2_CUDA=OFF -DS2_METAL=OFF \
            -DGGML_HIP=ON -DGGML_STATIC=OFF -DGGML_NATIVE=OFF -DGGML_AVX512=OFF \
            '-DGPU_TARGETS=gfx1030;gfx1100;gfx1101;gfx1102;gfx1103;gfx1150;gfx1151;gfx1152;gfx1153;gfx1200;gfx1201'

      - name: Build Linux ROCm
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ROCM_VENV/bin:$ROCM_BIN:$ROCM_LLVM_BIN:$PATH"
          export LD_LIBRARY_PATH="$ROCM_PATH/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 tools/ci/run-with-diagnostics.py --label "Linux ROCm build" --log ci-logs/linux-rocm-build.log -- cmake --build build-rocm --parallel 2 --verbose

      - name: Package and audit Linux ROCm runtime closure
        shell: bash
        run: |
          set -euo pipefail
          test -x build-rocm/s2-amd-core
          rm -rf release-rocm
          mkdir -p release-rocm/rocm/lib
          cp build-rocm/s2-amd-core release-rocm/s2-amd-core

          # HIP builds GGML shared. Do not publish an executable without its own
          # ggml-hip/base/cpu shared libraries.
          while IFS= read -r -d '' so; do cp -a "$so" release-rocm/; done < <(find build-rocm \( -type f -o -type l \) -name 'libggml*.so*' -print0)
          hip_so="$(find release-rocm -maxdepth 1 -name 'libggml-hip.so*' -print -quit)"
          test -n "$hip_so" || { echo '::error::libggml-hip was not packaged'; exit 1; }

          # Do NOT copy the complete ROCm SDK: it is very large and GitHub-hosted
          # runners only provide 14 GB of SSD. Build a fail-closed ELF dependency
          # closure instead, then add libraries/data that rocBLAS/hipBLASLt load
          # dynamically and therefore do not necessarily appear in DT_NEEDED.
          rocm_lib="$ROCM_PATH/lib"
          test -d "$rocm_lib"

          copy_rocm_lib() {
            local src="$1" name dst existing_hash new_hash
            src="$(readlink -f "$src")"
            test -f "$src" || { echo "::error::ROCm library target missing: $1"; return 1; }
            case "$src" in
              "$ROCM_PATH"/*) ;;
              *) echo "::error::Refusing ROCm dependency outside SDK root: $src"; return 1 ;;
            esac
            name="$(basename "$1")"
            dst="release-rocm/rocm/lib/$name"
            if test -e "$dst"; then
              existing_hash="$(sha256sum "$dst" | awk '{print $1}')"
              new_hash="$(sha256sum "$src" | awk '{print $1}')"
              test "$existing_hash" = "$new_hash" || { echo "::error::Conflicting ROCm libraries share basename $name"; return 1; }
              return 0
            fi
            cp -L "$src" "$dst"
          }

          # Seed the closure with all ROCm dependencies visible from the executable
          # and GGML shared libraries. ldd resolves them against the initialized SDK.
          collect_rocm_needed() {
            local obj="$1" dep
            while IFS= read -r dep; do
              test -n "$dep" || continue
              case "$dep" in
                "$ROCM_PATH"/*) copy_rocm_lib "$dep" ;;
              esac
            done < <(ldd "$obj" | awk '/=> \// { print $3 } /^\// { print $1 }')
          }
          collect_rocm_needed release-rocm/s2-amd-core
          for so in release-rocm/libggml*.so*; do test -e "$so" && collect_rocm_needed "$so"; done

          # Add known dlopen/runtime anchors. These may be absent from DT_NEEDED but
          # are required by current GGML HIP + rocBLAS/hipBLASLt execution paths.
          for pattern in 'libamdhip64.so*' 'libamd_comgr.so*' 'libhipblas.so*' 'libhipblaslt.so*' 'librocblas.so*' 'librocsolver.so*' 'librocm_kpack.so*'; do
            found=0
            while IFS= read -r -d '' candidate; do
              found=1
              copy_rocm_lib "$candidate"
            done < <(find "$rocm_lib" -maxdepth 2 \( -type f -o -type l \) -name "$pattern" -print0)
            test "$found" -eq 1 || { echo "::error::Required ROCm runtime pattern not found: $pattern"; exit 1; }
          done

          # Resolve transitive ROCm dependencies until the closure stops growing.
          previous=-1
          while :; do
            current="$(find release-rocm/rocm/lib -maxdepth 1 -type f | wc -l | tr -d ' ')"
            test "$current" != "$previous" || break
            previous="$current"
            while IFS= read -r -d '' so; do collect_rocm_needed "$so"; done < <(find release-rocm/rocm/lib -maxdepth 1 -type f -name '*.so*' -print0)
          done

          # rocBLAS and hipBLASLt use architecture-specific data files at runtime.
          # Copy only those data trees, not the compiler, headers, static archives, etc.
          for tree in rocblas hipblaslt; do
            mapfile -d '' candidates < <(find "$rocm_lib" -type d -path "*/$tree/library" -print0)
            if test "${#candidates[@]}" -ne 1; then
              printf '::error::Expected exactly one %s kernel data directory, found %s\n' "$tree" "${#candidates[@]}"
              printf '  %s\n' "${candidates[@]:-<none>}"
              exit 1
            fi
            mkdir -p "release-rocm/rocm/lib/$tree"
            cp -a "${candidates[0]}" "release-rocm/rocm/lib/$tree/library"
          done

          printf '%s\n' 'ROCm 7.14.1 multi-arch runtime. AMD amdgpu driver is still required. Vulkan is the compatibility fallback.' > release-rocm/ROCM_RUNTIME.txt

          export LD_LIBRARY_PATH="$PWD/release-rocm:$PWD/release-rocm/rocm/lib"
          ldd release-rocm/s2-amd-core | tee ci-logs/linux-rocm-ldd.txt
          if grep -q 'not found' ci-logs/linux-rocm-ldd.txt; then echo '::error::Linux ROCm package has unresolved ELF dependencies'; exit 1; fi
          for so in release-rocm/libggml*.so*; do
            test -e "$so" || continue
            ldd "$so" | tee -a ci-logs/linux-rocm-ldd.txt
          done
          if grep -q 'not found' ci-logs/linux-rocm-ldd.txt; then echo '::error::Linux ROCm GGML shared library has unresolved dependencies'; exit 1; fi

          # The artifact advertises an Ubuntu 22.04/glibc 2.35 userspace baseline.
          # Audit every ELF we ship, including ROCm sidecars, so a future wheel
          # refresh cannot silently raise that requirement.
          check_glibc_ceiling() {
            local file="$1" ceiling=2.35 max
            max="$(readelf --version-info "$file" 2>/dev/null | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' | sort -V | tail -n1 || true)"
            test -z "$max" && return 0
            if test "$(printf '%s\n%s\n' "$max" "$ceiling" | sort -V | tail -n1)" != "$ceiling"; then
              echo "::error::$file requires GLIBC_$max, above ROCm artifact ceiling GLIBC_$ceiling"
              return 1
            fi
            echo "GLIBC_BASELINE_OK file=$file max=$max ceiling=$ceiling"
          }
          while IFS= read -r -d '' elf; do
            readelf -h "$elf" >/dev/null 2>&1 || continue
            check_glibc_ceiling "$elf"
          done < <(find release-rocm -type f -print0)

          rocblas_tree="$(find release-rocm/rocm/lib -type d -path '*/rocblas/library' -print -quit)"
          test -n "$rocblas_tree" || { echo '::error::rocBLAS kernel library directory missing from Linux ROCm runtime'; exit 1; }

          # Preserve ROCm's soname symlinks, but never publish links that point
          # outside the archive or back into the ephemeral runner/venv.
          bad_link=0
          while IFS= read -r -d '' link; do
            target="$(readlink "$link")"
            case "$target" in
              /*) echo "::error::Absolute ROCm runtime symlink: $link -> $target"; bad_link=1; continue ;;
            esac
            resolved="$(readlink -f "$link" || true)"
            case "$resolved" in
              "$PWD/release-rocm/"*) ;;
              *) echo "::error::ROCm runtime symlink escapes package: $link -> $target"; bad_link=1 ;;
            esac
            test -e "$link" || { echo "::error::Broken ROCm runtime symlink: $link -> $target"; bad_link=1; }
          done < <(find release-rocm -type l -print0)
          test "$bad_link" -eq 0

          rm -f s2-linux-amd-x86-64
          bash tools/ci/make-linux-singlefile.sh release-rocm s2-amd-core "$PWD/s2-linux-amd-x86-64" linux-amd-x86-64
          test -x s2-linux-amd-x86-64
          ./s2-linux-amd-x86-64 --runtime-info | tee ci-logs/linux-amd-runtime-info.txt
          amd_bytes="$(stat -c %s s2-linux-amd-x86-64)"
          amd_mb=$((amd_bytes / 1024 / 1024))
          echo "Linux AMD single-file size: ${amd_mb} MB"
          if test "$amd_bytes" -ge $((1900 * 1024 * 1024)); then echo '::error::Linux AMD executable is too close to GitHub Release 2 GiB per-asset limit; split runtime by GPU family'; exit 1; fi
          df -h . "$RUNNER_TEMP"

      - name: Verify non-empty direct artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s s2-linux-amd-x86-64

      - name: Upload Linux AMD artifact
        uses: actions/upload-artifact@v7
        with:
          name: s2-linux-amd-x86-64
          path: s2-linux-amd-x86-64
          if-no-files-found: error
          archive: false


      - name: Collect robust crash report
        if: failure()
        shell: bash
        run: python3 tools/ci/collect-crash-report.py --label "Linux AMD" --logs ci-logs --output ci-logs/job-crash-report.txt

      - name: Upload concise failure diagnostics
        if: ${{ failure() && hashFiles('ci-logs/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-amd-diagnostics
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  build-macos-intel-cpu:
    name: macOS 15 Intel - CPU x86_64 (deployment 10.15)
    runs-on: macos-15-intel
    needs: preflight
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Pin Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_16.4.app/Contents/Developer
          test "$(uname -m)" = "x86_64"
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun --show-sdk-path
          xcrun --sdk macosx --show-sdk-version

      - name: Fetch pinned header-only Crow and Asio
        shell: bash
        run: |
          set -euo pipefail
          crow_commit=ae0fef0ee67eec897e401321b99b6dd7cfbdc155
          asio_sha256=755bd7f85a4b269c67ae0ea254907c078d408cce8e1a352ad2ed664d233780e8
          rm -rf build-deps
          mkdir -p build-deps/crow build-deps/asio
          curl -fL --retry 3 "https://github.com/CrowCpp/Crow/archive/${crow_commit}.tar.gz" -o build-deps/crow.tar.gz
          tar -xzf build-deps/crow.tar.gz -C build-deps/crow --strip-components=1
          grep -Eq 'VERSION[[:space:]]+1\.3\.4' build-deps/crow/CMakeLists.txt
          curl -fL --retry 3 https://github.com/chriskohlhoff/asio/archive/refs/tags/asio-1-30-2.tar.gz -o build-deps/asio.tar.gz
          printf '%s  %s\n' "$asio_sha256" build-deps/asio.tar.gz | shasum -a 256 -c -
          tar -xzf build-deps/asio.tar.gz -C build-deps/asio --strip-components=1
          test -f build-deps/crow/include/crow.h
          test -f build-deps/asio/asio/include/asio.hpp

      - name: Generate embedded tokenizer
        shell: bash
        run: python3 tools/embed_tokenizer.py tokenizer.json src/tokenizer_data.cpp src/tokenizer_data.h

      - name: Configure macOS Intel CPU
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/run-with-diagnostics.py --label "macOS Intel CPU configure" --log ci-logs/macos-intel-cpu-configure.log -- cmake -G Ninja -B build-macos-intel-cpu -S . \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DS2_CROW_INCLUDE_DIR="$(realpath build-deps/crow/include)" -DS2_ASIO_INCLUDE_DIR="$(realpath build-deps/asio/asio/include)" \
            -DS2_HIP=OFF -DS2_VULKAN=OFF -DS2_CUDA=OFF -DS2_METAL=OFF \
            -DGGML_HIP=OFF -DGGML_VULKAN=OFF -DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_NATIVE=OFF \
            -DGGML_SSE42=OFF -DGGML_AVX=OFF -DGGML_AVX_VNNI=OFF -DGGML_AVX2=OFF -DGGML_BMI2=OFF \
            -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_AVX512=OFF -DGGML_AVX512_VBMI=OFF -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_BF16=OFF

      - name: Build macOS Intel CPU
        shell: bash
        run: python3 tools/ci/run-with-diagnostics.py --label "macOS Intel CPU build" --log ci-logs/macos-intel-cpu-build.log -- cmake --build build-macos-intel-cpu --parallel 3

      - name: Verify macOS Intel CPU binary
        shell: bash
        run: |
          set -euo pipefail
          exe=build-macos-intel-cpu/s2-cpu
          test -x "$exe"
          file "$exe" | tee /tmp/file.txt
          grep -q 'x86_64' /tmp/file.txt
          deps="$(otool -L "$exe")"
          printf '%s\n' "$deps"
          if grep -Eqi 'Metal|Vulkan|MoltenVK' <<<"$deps"; then echo '::error::Intel CPU build unexpectedly links a GPU runtime'; exit 1; fi
          minos="$(vtool -show-build "$exe" 2>/dev/null || true)"
          printf '%s\n' "$minos"
          grep -q 'minos 10.15' <<<"$minos"

      - name: Package macOS Intel CPU
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-macos-intel-cpu
          mkdir release-macos-intel-cpu
          cp build-macos-intel-cpu/s2-cpu release-macos-intel-cpu/s2-macos-cpu-x86-64
          chmod +x release-macos-intel-cpu/s2-macos-cpu-x86-64
          test "$(find release-macos-intel-cpu -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = '1'
          test -x release-macos-intel-cpu/s2-macos-cpu-x86-64

      - name: Verify non-empty direct artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s release-macos-intel-cpu/s2-macos-cpu-x86-64

      - name: Upload macOS Intel CPU artifact
        uses: actions/upload-artifact@v7
        with:
          name: s2-macos-cpu-x86-64
          path: release-macos-intel-cpu/s2-macos-cpu-x86-64
          if-no-files-found: error
          archive: false


      - name: Collect robust crash report
        if: failure()
        shell: bash
        run: python3 tools/ci/collect-crash-report.py --label "macOS Intel CPU" --logs ci-logs --output ci-logs/job-crash-report.txt

      - name: Upload concise failure diagnostics
        if: ${{ failure() && hashFiles('ci-logs/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-intel-cpu-diagnostics
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish all backend release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-cuda, build-cpu, build-windows-amd, build-linux-cpu, build-linux-vulkan, build-linux-cuda, build-linux-amd, build-metal, build-macos-intel-cpu]
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    timeout-minutes: 45

    steps:
      - name: Download Windows Vulkan artifact
        uses: actions/download-artifact@v8
        with:
          name: s2-windows-vulkan-x86-64.exe
          path: artifacts/windows-vulkan

      - name: Download Windows CUDA artifact
        uses: actions/download-artifact@v8
        with:
          name: s2-windows-cuda-x86-64.exe
          path: artifacts/windows-cuda

      - name: Download Windows CPU artifact
        uses: actions/download-artifact@v8
        with:
          name: s2-windows-cpu-x86-64.exe
          path: artifacts/windows-cpu

      - name: Download Windows AMD artifact
        uses: actions/download-artifact@v8
        with:
          name: s2-windows-amd-x86-64.exe
          path: artifacts/windows-amd

      - name: Download Linux CPU artifact
        uses: actions/download-artifact@v8
        with:
          name: s2-linux-cpu-x86-64
          path: artifacts/linux-cpu

      - name: Download Linux Vulkan artifact
        uses: actions/download-artifact@v8
        with:
          name: s2-linux-vulkan-x86-64
          path: artifacts/linux-vulkan

      - name: Download Linux CUDA artifact
        uses: actions/download-artifact@v8
        with:
          name: s2-linux-cuda-x86-64
          path: artifacts/linux-cuda

      - name: Download Linux AMD artifact
        uses: actions/download-artifact@v8
        with:
          name: s2-linux-amd-x86-64
          path: artifacts/linux-amd

      - name: Download macOS Metal artifact
        uses: actions/download-artifact@v8
        with:
          name: s2-macos-metal-arm64
          path: artifacts/macos-metal

      - name: Download macOS Intel CPU artifact
        uses: actions/download-artifact@v8
        with:
          name: s2-macos-cpu-x86-64
          path: artifacts/macos-cpu

      - name: Verify exact release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = @(
            'artifacts\windows-vulkan\s2-windows-vulkan-x86-64.exe',
            'artifacts\windows-cuda\s2-windows-cuda-x86-64.exe',
            'artifacts\windows-cpu\s2-windows-cpu-x86-64.exe',
            'artifacts\windows-amd\s2-windows-amd-x86-64.exe',
            'artifacts\linux-cpu\s2-linux-cpu-x86-64',
            'artifacts\linux-vulkan\s2-linux-vulkan-x86-64',
            'artifacts\linux-cuda\s2-linux-cuda-x86-64',
            'artifacts\linux-amd\s2-linux-amd-x86-64',
            'artifacts\macos-metal\s2-macos-metal-arm64',
            'artifacts\macos-cpu\s2-macos-cpu-x86-64'
          )
          foreach ($path in $expected) {
            if (-Not (Test-Path $path -PathType Leaf)) { throw "Release input missing: $path" }
            $dir = Split-Path $path -Parent
            $entries = @(Get-ChildItem $dir -File)
            if ($entries.Count -ne 1) { throw "Artifact must contain exactly one executable: ${dir}: $($entries.Name -join ', ')" }
          }
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          fail_on_unmatched_files: true
          files: |
            artifacts/windows-vulkan/s2-windows-vulkan-x86-64.exe
            artifacts/windows-cuda/s2-windows-cuda-x86-64.exe
            artifacts/windows-cpu/s2-windows-cpu-x86-64.exe
            artifacts/windows-amd/s2-windows-amd-x86-64.exe
            artifacts/linux-cpu/s2-linux-cpu-x86-64
            artifacts/linux-vulkan/s2-linux-vulkan-x86-64
            artifacts/linux-cuda/s2-linux-cuda-x86-64
            artifacts/linux-amd/s2-linux-amd-x86-64
            artifacts/macos-metal/s2-macos-metal-arm64
            artifacts/macos-cpu/s2-macos-cpu-x86-64
          generate_release_notes: true
